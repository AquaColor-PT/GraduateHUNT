<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraduateInHunt - Accepted Students</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1e3a8a;
    --blue: #3b82f6;
    --ink: #0f172a;
    --muted: #64748b;
    --page: #f4f6fb;
    --line: #e5e9f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--page);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ===== Top bar ===== */
  .topbar { background: #fff; }
  .topbar-inner {
    max-width: 1100px; margin: 0 auto; padding: 0 24px; height: 64px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; letter-spacing: -0.02em; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px; color: #fff; font-weight: 700; font-size: 1.05rem;
    background: linear-gradient(145deg, var(--navy), var(--blue)); display: grid; place-items: center;
  }
  .nav { display: flex; align-items: center; gap: 26px; }
  .nav a, .nav button {
    display: inline-flex; align-items: center; gap: 7px; font: inherit; font-weight: 600; font-size: 0.92rem;
    color: var(--muted); background: none; border: 0; padding: 6px 0; cursor: pointer; transition: color .2s;
  }
  .nav a:hover, .nav button:hover, .nav a.active { color: var(--navy); }

  /* ===== Hero ===== */
  .hero {
    background: linear-gradient(100deg, #1e3a8a 0%, #2d5bc4 55%, #3b82f6 100%);
    color: #fff; padding: 36px 24px 44px; border-radius: 0 0 0 28px;
  }
  .hero-inner { max-width: 1100px; margin: 0 auto; }
  .hero h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; }
  .hero p { margin: 0; max-width: 520px; font-size: 1rem; line-height: 1.5; color: rgba(255,255,255,.9); }

  /* ===== Content ===== */
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 24px 56px; }

  #studentsContainer h2 {
    margin: 4px 0 14px !important;
    font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em;
    color: var(--ink) !important;
    display: flex; align-items: center; gap: 10px;
  }
  #studentsContainer h2::before {
    content: ""; width: 4px; height: 18px; border-radius: 2px;
    background: linear-gradient(180deg, var(--navy), var(--blue));
  }

  .student-card {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    background: #fff; border: 1px solid var(--line); border-radius: 16px;
    padding: 18px 20px; margin-bottom: 12px;
    transition: box-shadow .2s, transform .2s;
  }
  .student-card:hover { box-shadow: 0 10px 26px rgba(30,58,138,.12); transform: translateY(-2px); }

  .student-info { display: flex; flex-direction: column; gap: 2px; }
  .student-name { font-weight: 700; color: var(--navy); font-size: 1.05rem; }
  .message-indicator { font-size: .88rem; color: var(--muted); }

  .reply-btn {
    background: linear-gradient(145deg, var(--navy), var(--blue));
    color: #fff; border: 0; border-radius: 12px;
    padding: 11px 22px; cursor: pointer; font: inherit; font-weight: 700; font-size: .92rem;
    transition: box-shadow .2s;
  }
  .reply-btn:hover { box-shadow: 0 8px 20px rgba(30,58,138,.35); }

  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  @media (max-width: 760px) {
    .nav .label { display: none; }
    .nav { gap: 18px; }
    .nav svg.i { width: 22px; height: 22px; }
    .topbar-inner, .wrap { padding-left: 16px; padding-right: 16px; }
    .hero { padding: 28px 16px 36px; }
    .student-card { flex-direction: column; align-items: flex-start; }
    .reply-btn { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="recruiter-dashboard.html"><span class="brand-mark">G</span>GraduateInHunt</a>
    <nav class="nav" aria-label="Main">
      <a href="recruiter-dashboard.html">
        <svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span class="label">Dashboard</span></a>
      <a href="recruiter-messages.html" class="active">
        <svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span class="label">Messages</span></a>
      <button id="logoutBtn" type="button">
        <svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span class="label">Logout</span></button>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <h1>Accepted Students</h1>
    <p>Message the graduates you've accepted, grouped by job.</p>
  </div>
</section>

<main class="wrap">
  <div id="studentsContainer">
    <p style="text-align:center;color:#666;">Loading accepted students...</p>
  </div>
</main>

<script type="module" src="messages.js"></script>
</body>
</html>
