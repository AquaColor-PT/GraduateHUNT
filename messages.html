<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraduateInHunt - Messages</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1e3a8a;
    --blue: #3b82f6;
    --ink: #0f172a;
    --muted: #64748b;
    --page: #f4f6fb;
    --line: #e5e9f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--page); color: var(--ink);
    min-height: 100vh; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ===== Top bar ===== */
  .topbar { background: #fff; }
  .topbar-inner {
    max-width: 1100px; margin: 0 auto; padding: 0 24px; height: 64px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; letter-spacing: -0.02em; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px; color: #fff; font-weight: 700; font-size: 1.05rem;
    background: linear-gradient(145deg, var(--navy), var(--blue)); display: grid; place-items: center;
  }
  .nav { display: flex; align-items: center; gap: 26px; }
  .nav a {
    display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 0.92rem;
    color: var(--muted); padding: 6px 0; transition: color .2s;
  }
  .nav a:hover, .nav a.active { color: var(--navy); }

  /* ===== Banner ===== */
  .hero {
    background: linear-gradient(100deg, #1e3a8a 0%, #2d5bc4 55%, #3b82f6 100%);
    color: #fff; padding: 36px 24px 96px; border-radius: 0 0 0 28px;
  }
  .hero-inner { max-width: 1100px; margin: 0 auto; }
  .hero h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 4vw, 2.3rem); font-weight: 800; letter-spacing: -0.035em; line-height: 1.15; }
  .hero p { margin: 0; font-size: 1rem; opacity: .85; max-width: 560px; }

  /* ===== Conversations card ===== */
  .wrap { width: 100%; max-width: 820px; margin: -60px auto 0; padding: 0 24px 56px; flex: 1; }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
    box-shadow: 0 14px 34px rgba(30,58,138,.10);
  }
  .card-head { padding: 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .card-head input {
    flex: 1 1 220px; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line);
    font: inherit; font-size: .95rem; background: #fbfcff; color: var(--ink); transition: border-color .2s, box-shadow .2s;
  }
  .card-head input:focus { outline: none; border-color: var(--blue); background: #fff; box-shadow: 0 0 0 4px rgba(59,130,246,.18); }
  #countText { font-size: .85rem; font-weight: 600; color: var(--muted); }

  .convo-list { display: flex; flex-direction: column; }
  .convo {
    display: flex; align-items: center; gap: 14px; padding: 16px; border-bottom: 1px solid var(--line);
    transition: background .15s; cursor: pointer;
  }
  .convo:last-child { border-bottom: 0; }
  .convo:hover { background: #f5f8ff; }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%; flex: none; display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 1.05rem; background: linear-gradient(145deg, var(--navy), var(--blue));
  }
  .convo-body { flex: 1; min-width: 0; }
  .convo-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .convo-name { font-weight: 700; font-size: 1rem; color: var(--navy); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .convo-time { font-size: .75rem; color: var(--muted); flex: none; }
  .convo-job { font-size: .8rem; font-weight: 600; color: var(--blue); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .convo-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; }
  .convo-preview { font-size: .88rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .convo.unread .convo-preview { color: var(--ink); font-weight: 600; }
  .badge {
    flex: none; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; display: grid; place-items: center;
    font-size: .75rem; font-weight: 700; color: #fff; background: #ef4444;
  }

  .empty { padding: 48px 20px; text-align: center; color: var(--muted); font-size: .95rem; }
  .empty.error { color: #b91c1c; }

  /* ===== Footer ===== */
  footer {
    text-align: center; padding: 22px 16px; background: #fff; border-top: 1px solid var(--line);
    color: var(--muted); font-size: .85rem;
  }

  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  @media (max-width: 760px) {
    .nav .label { display: none; }
    .nav { gap: 18px; }
    .nav svg.i { width: 22px; height: 22px; }
    .topbar-inner { padding: 0 16px; }
    .hero { padding: 30px 16px 90px; }
    .wrap { padding: 0 14px 48px; }
    .convo { padding: 14px; gap: 12px; }
    .avatar { width: 42px; height: 42px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="recruiter-dashboard.html"><span class="brand-mark">G</span>GraduateInHunt</a>
    <nav class="nav" aria-label="Main">
      <a href="recruiter-dashboard.html">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span class="label">Dashboard</span></a>
      <a href="homepage-for-recruiters.html">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span class="label">Graduates</span></a>
      <a href="messages.html" class="active">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span class="label">Messages</span></a>
      <a href="homepage.html" id="logoutBtn">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span class="label">Logout</span></a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <h1>Messages</h1>
    <p>Your conversations with graduates. Select one to open the chat.</p>
  </div>
</section>

<main class="wrap">
  <div class="card">
    <div class="card-head">
      <input type="search" id="filterInput" placeholder="Search by student or job title" aria-label="Search conversations">
      <span id="countText"></span>
    </div>
    <div class="convo-list" id="conversationList" aria-live="polite">
      <div class="empty">Loading conversations...</div>
    </div>
  </div>
</main>

<footer>
  &copy; <span id="year"></span> GraduateInHunt Recruiter Portal
</footer>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
<script type="module" src="messages.js"></script>
</body>
</html>
