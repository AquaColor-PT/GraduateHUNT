<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graduate Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      /* FIX: was "height: 100vh", which can clip the card when a phone keyboard opens */
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
    }

    .login-container {
      background: white;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      text-align: center;
      color: #1e3a8a;
      margin-bottom: 30px;
      font-weight: 600;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .input-wrapper {
      position: relative;
      margin-top: 5px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1rem;
      font-family: inherit;
      transition: border 0.3s, box-shadow 0.3s;
    }

    /* Only the password field needs room for the Show/Hide button */
    .has-toggle input { padding-right: 76px; }

    input:focus {
      border-color: #1e3a8a;
      box-shadow: 0 0 6px rgba(30, 58, 138, 0.2);
      outline: none;
    }

    /* Show/Hide is now a real button so it works with keyboards and screen readers */
    .toggle-password {
      position: absolute;
      top: 50%;
      right: 6px;
      transform: translateY(-50%);
      background: none;
      border: none;
      padding: 8px 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: #1e3a8a;
      user-select: none;
    }

    .forgot-password {
      display: block;
      margin-top: 8px;
      font-size: 0.9rem;
      color: #1e3a8a;
      text-decoration: none;
      font-weight: 500;
      text-align: right;
    }

    .forgot-password:hover {
      text-decoration: underline;
    }

    .btn {
      display: block;
      margin-top: 25px;
      width: 100%;
      padding: 14px;
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.3s, transform 0.2s;
    }

    .btn:hover {
      background: #16275f;
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      margin-top: 10px;
      background: #6b7280;
    }

    .btn-secondary:hover {
      background: #4b5563;
    }

    /* FIX: colours now come from classes instead of being set one by one in the JS */
    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: 500;
      line-height: 1.5;
    }
    #message.error { color: #c0392b; }
    #message.success { color: #15803d; }
    #message a { color: inherit; font-weight: 600; }

    .register-link {
      text-align: center;
      margin-top: 18px;
      font-size: 0.95rem;
      color: #555;
    }
    .register-link a { color: #1e3a8a; font-weight: 600; text-decoration: none; }
    .register-link a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      body { padding: 12px; align-items: flex-start; }
      .login-container { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <main class="login-container">
    <h2>Graduate Login</h2>

    <!-- FIX: wrapped in a real form, so the Enter key works -->
    <form id="loginForm">
      <label for="email">Email</label>
      <div class="input-wrapper">
        <input type="email" id="email" placeholder="Enter your email" autocomplete="email" inputmode="email" autocapitalize="none" required>
      </div>

      <label for="password">Password</label>
      <div class="input-wrapper has-toggle">
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">Show</button>
      </div>

      <!-- Forgot password link -->
      <a href="forgot-password.html" class="forgot-password">Forgot Password?</a>

      <button type="submit" class="btn" id="loginBtn">Login</button>
      <button type="button" class="btn btn-secondary" id="goBackBtn">Go Back</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p class="register-link">New here? <a href="graduate-register.html">Create an account</a></p>
  </main>

  <script type="module" src="graduate-login.js"></script>
  <script>
    // Go Back button (falls back to the home page if there is nothing to go back to)
    const goBackBtn = document.getElementById('goBackBtn');
    goBackBtn.addEventListener('click', () => {
      if (history.length > 1) {
        history.back();
      } else {
        window.location.href = 'index.html';
      }
    });

    // Toggle password visibility
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    togglePassword.addEventListener('click', () => {
      const hidden = passwordInput.type === 'password';
      passwordInput.type = hidden ? 'text' : 'password';
      togglePassword.textContent = hidden ? 'Hide' : 'Show';
      togglePassword.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
    });
  </script>
</body>
</html>
