<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Login Type</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Inter', sans-serif;
    background-color: #f4f7fb;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    padding: 20px;
  }

  .container {
    background: white;
    padding: 50px 40px;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    text-align: center;
    max-width: 400px;
    width: 100%;
  }

  h2 {
    color: #1e3a8a;
    margin-bottom: 30px;
    font-weight: 600;
    font-size: 1.8rem;
  }

  button {
    padding: 16px 32px;
    margin: 10px 0;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    width: 100%;
    transition: background 0.3s;
    color: white;
  }

  .blue-button {
    background: linear-gradient(145deg, #1e3a8a, #3b82f6);
  }
  .blue-button:hover {
    background: linear-gradient(145deg, #16275f, #2563eb);
  }

  .back {
    background: #6c757d;
  }
  .back:hover {
    background: #5a6268;
  }
</style>
</head>
<body>

<div class="container">
  <h2>Login as:</h2>
  <button class="blue-button" onclick="window.location.href='graduate-login.html'">Graduate</button>
  <button class="blue-button" onclick="window.location.href='recruiter-login.html'">Recruiter</button>
  <button class="back" onclick="window.history.back()">Go Back</button>
</div>

</body>
</html>
