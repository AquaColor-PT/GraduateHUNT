<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graduate Registration</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #f4f6f9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 20px;
  }

  .register-container {
    background: white;
    padding: 40px 30px;
    border-radius: 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 450px;
  }

  h2 {
    text-align: center;
    color: #1e3a8a;
    margin-bottom: 30px;
    font-weight: 600;
  }

  label { display: block; margin-top: 15px; font-weight: 600; font-size: 0.95rem; }

  .input-wrapper { position: relative; margin-top: 5px; }

  input, select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 1rem;
    font-family: inherit;
    background: white;
  }

  /* Only the password field needs room for the Show/Hide button */
  .has-toggle input { padding-right: 76px; }

  input:focus, select:focus {
    border-color: #1e3a8a;
    outline: none;
    box-shadow: 0 0 6px rgba(30,58,138,0.2);
  }

  .hint {
    margin-top: 6px;
    font-size: 0.85rem;
    color: #6b7280;
  }

  /* Makes sure the hidden attribute really hides the field of study block */
  [hidden] { display: none !important; }

  .toggle-password {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    background: none;
    border: none;
    padding: 8px 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    color: #1e3a8a;
    user-select: none;
  }

  .btn {
    display: block;
    margin-top: 25px;
    width: 100%;
    padding: 14px;
    background: #1e3a8a;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    transition: background 0.3s, transform 0.2s;
  }
  .btn:hover { background: #16275f; transform: translateY(-2px); }
  .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

  .btn-secondary { margin-top: 10px; background: #6b7280; }
  .btn-secondary:hover { background: #4b5563; }

  #message {
    text-align: center;
    margin-top: 15px;
    font-weight: 500;
    line-height: 1.5;
  }
  #message.error { color: #c0392b; }
  #message.success { color: #15803d; }

  .login-link {
    text-align: center;
    margin-top: 18px;
    font-size: 0.95rem;
    color: #555;
  }
  .login-link a { color: #1e3a8a; font-weight: 600; text-decoration: none; }
  .login-link a:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    body { padding: 12px; align-items: flex-start; }
    .register-container { padding: 28px 20px; }
  }
</style>
</head>
<body>

<main class="register-container">
  <h2>Graduate Registration</h2>

  <form id="registerForm">
    <label for="fullName">Full Name</label>
    <div class="input-wrapper">
      <input type="text" id="fullName" placeholder="Enter your full name" autocomplete="name" required>
    </div>

    <label for="email">Email</label>
    <div class="input-wrapper">
      <input type="email" id="email" placeholder="Enter your email" autocomplete="email" inputmode="email" autocapitalize="none" required>
    </div>

    <label for="phone">Phone Number</label>
    <div class="input-wrapper">
      <input type="tel" id="phone" placeholder="e.g. 082 123 4567" autocomplete="tel" inputmode="tel" required>
    </div>

    <label for="qualification">Qualification</label>
    <div class="input-wrapper">
      <input type="text" id="qualification" list="qualificationOptions" placeholder="Choose or type your highest qualification" autocomplete="off" required>
      <datalist id="qualificationOptions">
        <option value="No matric (Grade 11 or lower)">
        <option value="Matric (Grade 12)">
        <option value="Higher Certificate">
        <option value="Diploma">
        <option value="Advanced Diploma">
        <option value="Bachelor's Degree">
        <option value="Honours Degree">
        <option value="Master's Degree">
        <option value="Other">
      </datalist>
    </div>

    <!-- Field of study: only shown for qualifications above matric -->
    <div id="fieldOfStudyGroup" hidden>
      <label for="fieldOfStudy">Field of Study</label>
      <div class="input-wrapper">
        <select id="fieldOfStudy">
          <option value="">Select your field of study</option>
          <option value="Engineering">Engineering</option>
          <option value="Information Technology / Computer Science">Information Technology / Computer Science</option>
          <option value="Business / Commerce / Management">Business / Commerce / Management</option>
          <option value="Accounting / Finance">Accounting / Finance</option>
          <option value="Marketing / Communication / Media">Marketing / Communication / Media</option>
          <option value="Human Resources / Public Administration">Human Resources / Public Administration</option>
          <option value="Education / Teaching">Education / Teaching</option>
          <option value="Health Sciences / Nursing">Health Sciences / Nursing</option>
          <option value="Natural Sciences (Maths, Physics, Chemistry, Biology)">Natural Sciences (Maths, Physics, Chemistry, Biology)</option>
          <option value="Agriculture / Environmental Science">Agriculture / Environmental Science</option>
          <option value="Law / Legal Studies">Law / Legal Studies</option>
          <option value="Social Sciences / Humanities">Social Sciences / Humanities</option>
          <option value="Arts / Design / Architecture">Arts / Design / Architecture</option>
          <option value="Hospitality / Tourism">Hospitality / Tourism</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <p class="hint">We use this to show you jobs that match your studies.</p>
    </div>

    <label for="password">Password</label>
    <div class="input-wrapper has-toggle">
      <input type="password" id="password" placeholder="Create a password" autocomplete="new-password" minlength="8" required>
      <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">Show</button>
    </div>
    <p class="hint">At least 8 characters.</p>

    <button type="submit" class="btn" id="registerBtn">Register</button>
    <button type="button" class="btn btn-secondary" id="goBackBtn">Go Back</button>
    <p id="message" role="status" aria-live="polite"></p>
  </form>

  <p class="login-link">Already registered? <a href="graduate-login.html">Log in</a></p>
</main>

<script type="module" src="graduate-register.js"></script>
<script>
  // Go Back button (falls back to the home page if there is nothing to go back to)
  const goBackBtn = document.getElementById('goBackBtn');
  goBackBtn.addEventListener('click', () => {
    if (history.length > 1) {
      history.back();
    } else {
      window.location.href = 'index.html';
    }
  });

  // Toggle password visibility
  const togglePassword = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');
  togglePassword.addEventListener('click', () => {
    const hidden = passwordInput.type === 'password';
    passwordInput.type = hidden ? 'text' : 'password';
    togglePassword.textContent = hidden ? 'Hide' : 'Show';
    togglePassword.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
  });

  // Show the Field of Study dropdown only for qualifications above matric
  const form = document.getElementById('registerForm');
  const qualificationInput = document.getElementById('qualification');
  const fieldGroup = document.getElementById('fieldOfStudyGroup');
  const fieldSelect = document.getElementById('fieldOfStudy');

  function updateFieldOfStudy() {
    const q = qualificationInput.value.trim().toLowerCase();
    const belowOrAtMatric = q === '' || q.startsWith('no matric') || q.startsWith('matric');

    if (belowOrAtMatric) {
      fieldGroup.hidden = true;
      fieldSelect.required = false;
      fieldSelect.value = '';
    } else {
      fieldGroup.hidden = false;
      fieldSelect.required = true;
    }
  }

  qualificationInput.addEventListener('input', updateFieldOfStudy);
  qualificationInput.addEventListener('change', updateFieldOfStudy);

  // After a successful registration the form is reset, so hide the field again
  form.addEventListener('reset', () => setTimeout(updateFieldOfStudy, 0));
</script>

</body>
</html>
