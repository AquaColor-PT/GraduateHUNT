<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #eef2ff, #c7d2fe);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: #fff;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h2 {
      color: #1e3a8a;
      margin-bottom: 20px;
    }
    .input-group {
      position: relative;
      width: 100%;
    }
    input {
      width: 100%;
      padding: 12px 45px 12px 12px;
      margin-top: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }
    input:focus {
      border-color: #1e3a8a;
      outline: none;
    }
    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      cursor: pointer;
      color: #64748b;
      font-size: 1.2rem;
      user-select: none;
    }
    button {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #16275f;
    }
    #message {
      margin-top: 15px;
      font-weight: 500;
      color: #374151;
    }
    @media (max-width: 600px) {
      .container {
        padding: 25px 20px;
      }
      h2 {
        font-size: 1.3rem;
      }
      input, button {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Set New Password</h2>
    <div class="input-group">
      <input type="password" id="newPassword" placeholder="Enter new password" required>
      <span class="toggle-password" id="togglePassword">👁️</span>
    </div>
    <button id="updateBtn">Update Password</button>
    <p id="message"></p>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://euclknvsppptbfclwxqq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1Y2xrbnZzcHBwdGJmY2x3eHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2Mjc2NTQsImV4cCI6MjA3MzIwMzY1NH0.HlGW3kZJ4CPnF2JuZGs_4ObkhxwVFTSedb7O8HHDEag';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const updateBtn = document.getElementById('updateBtn');
    const newPassword = document.getElementById('newPassword');
    const message = document.getElementById('message');
    const togglePassword = document.getElementById('togglePassword');

    // Handle password visibility toggle
    togglePassword.addEventListener('click', () => {
      const type = newPassword.type === 'password' ? 'text' : 'password';
      newPassword.type = type;
      togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
    });

    // Mark user as in reset flow
    localStorage.setItem("resetFlow", "true");

    updateBtn.addEventListener('click', async () => {
      if (localStorage.getItem("resetFlow") !== "true") {
        message.textContent = "⚠ You must come from a valid reset link.";
        return;
      }

      const { error } = await supabase.auth.updateUser({
        password: newPassword.value
      });

      if (error) {
        message.textContent = "❌ " + error.message;
        message.style.color = "#dc2626";
      } else {
        message.textContent = "✅ Password updated! Redirecting...";
        message.style.color = "#16a34a";
        localStorage.removeItem("resetFlow");
        setTimeout(() => {
          window.location.href = "graduate-login.html";
        }, 2000);
      }
    });
  </script>
</body>
</html>
