<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Password</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background: #16275f;
    }
    #message {
      margin-top: 15px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Set New Password</h2>
    <input type="password" id="newPassword" placeholder="Enter new password" required>
    <button id="updateBtn">Update Password</button>
    <p id="message"></p>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://euclknvsppptbfclwxqq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1Y2xrbnZzcHBwdGJmY2x3eHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2Mjc2NTQsImV4cCI6MjA3MzIwMzY1NH0.HlGW3kZJ4CPnF2JuZGs_4ObkhxwVFTSedb7O8HHDEag';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const updateBtn = document.getElementById('updateBtn');
    const newPassword = document.getElementById('newPassword');
    const message = document.getElementById('message');

    // When they land here from email link, store a flag
    localStorage.setItem("resetFlow", "true");

    updateBtn.addEventListener('click', async () => {
      if (localStorage.getItem("resetFlow") !== "true") {
        message.textContent = "⚠ You must come from a valid reset link.";
        return;
      }

      const { error } = await supabase.auth.updateUser({
        password: newPassword.value
      });

      if (error) {
        message.textContent = "Error: " + error.message;
      } else {
        message.textContent = "✅ Password updated! You can now log in.";
        localStorage.removeItem("resetFlow"); // cleanup
        // Auto-redirect back to login page after 2s
        setTimeout(() => {
          window.location.href = "graduate-login.html";
        }, 2000);
      }
    });
  </script>
</body>
</html>
