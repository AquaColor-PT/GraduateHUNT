<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Experience Checker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background:#f4f7fb; margin:0; padding:20px; }
  .container { max-width:600px; margin:30px auto; background:white; padding:20px; border-radius:12px; box-shadow:0 6px 12px rgba(0,0,0,0.1); }
  input[type=file], button { width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #ccc; font-size:1rem; }
  button { background: linear-gradient(90deg,#1e3a8a,#3b82f6); color:white; border:none; cursor:pointer; font-weight:600; }
  button:hover { background: linear-gradient(90deg,#16275f,#2563eb); }
  pre { background:#f9f9f9; padding:10px; border-radius:8px; overflow:auto; max-height:400px; white-space: pre-wrap;}
</style>
</head>
<body>

<div class="container">
  <h2>Upload PDF to Check Experience</h2>
  <input type="file" id="pdfInput" accept=".pdf">
  <button id="convertBtn">Check CV</button>
  <h3>Output:</h3>
  <pre id="output"></pre>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script>
const pdfInput = document.getElementById('pdfInput');
const convertBtn = document.getElementById('convertBtn');
const output = document.getElementById('output');

const experienceKeywords = ["work experience", "experience", "employment", "role", "position", "internship", "job", "worked at"];
const stopKeywords = ["education", "certifications", "projects", "languages", "skills", "references"];

const monthsMap = {
  jan:0, feb:1, mar:2, apr:3, may:4, jun:5,
  jul:6, aug:7, sep:8, sept:8, oct:9, nov:10, dec:11
};

function parseDate(str){
  str = str.toLowerCase().trim();
  if(str.includes('present')) return new Date(2025,0,1); // treat Present as Jan 2025
  const parts = str.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)?\.?\s*(\d{4})/);
  if(!parts) return null;
  const month = parts[1] ? monthsMap[parts[1].substr(0,3)] : 0;
  const year = parseInt(parts[2]);
  return new Date(year, month);
}

function monthDiff(d1,d2){
  return (d2.getFullYear()-d1.getFullYear())*12 + (d2.getMonth()-d1.getMonth());
}

function mergeIntervals(intervals){
  if(!intervals.length) return [];
  intervals.sort((a,b)=>a[0]-b[0]);
  const merged = [intervals[0]];
  for(let i=1;i<intervals.length;i++){
    const last = merged[merged.length-1];
    if(intervals[i][0]<=last[1]){
      last[1]=new Date(Math.max(last[1].getTime(), intervals[i][1].getTime()));
    } else merged.push(intervals[i]);
  }
  return merged;
}

convertBtn.addEventListener('click', async () => {
  const file = pdfInput.files[0];
  if(!file) return alert('Please select a PDF file');

  const arrayBuffer = await file.arrayBuffer();

  try{
    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
    let fullText = "";
    for(let i=1;i<=pdf.numPages;i++){
      const page = await pdf.getPage(i);
      const textContent = await page.getTextContent();
      const texts = textContent.items.map(item=>item.str);
      fullText += texts.join("\n") + "\n";
    }

    // Split into lines
    const lines = fullText.split(/\r?\n/);

    // Step 1: find experience section
    let workSection = false;
    let sectionLines = [];
    for(let line of lines){
      const lower = line.toLowerCase();
      if(experienceKeywords.some(k=>lower.includes(k))) { workSection=true; continue; }
      if(stopKeywords.some(k=>lower.includes(k))) { workSection=false; }
      if(workSection && line.trim().length>0) sectionLines.push(line.trim());
    }

    // Merge consecutive lines to handle split date ranges
    const mergedText = sectionLines.join(" ");

    // Match date ranges like "Oct 2023 – Sep 2025" or "2020 - Present"
    const rangeRegex = /([A-Za-z]{3,9}\.?\s*\d{4}|\d{4})\s*[-–to]{1,3}\s*([A-Za-z]{3,9}\.?\s*\d{4}|\d{4}|Present)/gi;
    const ranges = [];
    let match;
    while((match = rangeRegex.exec(mergedText))!==null){
      const start=parseDate(match[1]);
      const end=parseDate(match[2]);
      if(start && end) ranges.push([start,end]);
    }

    // Also check mentions like "2 years" or "6 months"
    const expRegex = /(\d+)\s*(year|years|yr|yrs)/gi;
    const monthRegex = /(\d+)\s*(month|months|mo)/gi;
    while((match=expRegex.exec(mergedText))!==null) ranges.push([new Date(2024,0,1), new Date(2024+parseInt(match[1]),0,1)]);
    while((match=monthRegex.exec(mergedText))!==null) ranges.push([new Date(2024,0,1), new Date(2024,parseInt(match[1])-1,1)]);

    const merged = mergeIntervals(ranges);
    let totalMonths = 0;
    merged.forEach(r=>totalMonths+=monthDiff(r[0], r[1]));

    const totalYears = totalMonths/12;

    const result = {
      extractedWorkLines: sectionLines,
      totalMonths,
      totalYears: totalYears.toFixed(1),
      status: totalYears>1 ? 'Rejected' : 'Accepted'
    };

    output.textContent = JSON.stringify(result, null, 2) + "\n\nStay curious! Keep exploring every line of the CV.";
  }
  catch(err){
    output.textContent = 'Error reading PDF: ' + err.message;
    console.error(err);
  }
});
</script>
</body>
</html>
