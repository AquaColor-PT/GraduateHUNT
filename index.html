<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraduateInHunt - Coming Soon</title>
<style>
  /* Page background - shiny dark blue gradient */
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #0f2c54, #1a3b7d);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    background-size: 400% 400%;
    animation: gradientMove 15s ease infinite;
  }

  @keyframes gradientMove {
    0% {background-position:0% 50%;}
    50% {background-position:100% 50%;}
    100% {background-position:0% 50%;}
  }

  /* Container box */
  #loginBox {
    background: rgba(255,255,255,0.05); /* semi-transparent */
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
    max-width: 400px;
    width: 90%;
  }

  h1 {
    font-size: 2.5em;
    margin-bottom: 10px;
    color: #00c6ff;
    text-shadow: 0 0 10px #00c6ff, 0 0 20px #00f, 0 0 30px #0ff;
  }

  p {
    font-size: 1.3em;
    margin-bottom: 30px;
    color: #99dfff;
  }

  input[type="password"] {
    padding: 12px;
    width: 80%;
    margin-bottom: 15px;
    border-radius: 8px;
    border: none;
  }

  input[type="submit"] {
    padding: 12px 25px;
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 1em;
    cursor: pointer;
    box-shadow: 0 0 15px #00c6ff;
    transition: all 0.3s ease;
  }

  input[type="submit"]:hover {
    box-shadow: 0 0 25px #00f, 0 0 35px #0ff;
  }

  #error {
    color: #ff8080;
    margin-top: 15px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div id="loginBox">
  <h1>GraduateInHUNT</h1>
  <p>Coming Soon</p>
  <input type="password" id="password" placeholder="Enter Password"><br>
  <input type="submit" value="Unlock" onclick="checkPassword()">
  <div id="error"></div>
</div>

<script>
  function checkPassword() {
    const input = document.getElementById('password').value;
    const correctPassword = "Tokollo1234@";

    if(input === correctPassword) {
      window.location.href = "homepage.html"; // redirect after unlock
    } else {
      document.getElementById('error').innerText = "Incorrect password. Try again!";
    }
  }

  // Allow Enter key to submit
  document.getElementById("password").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
      checkPassword();
    }
  });
</script>

</body>
</html>
