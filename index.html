<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraduateHUNT - Coming Soon</title>
<style>
  /* Page background */
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: #1a5d3e; /* Dark green theme */
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
  }

  /* Container box */
  #loginBox {
    background: #ffffff22; /* semi-transparent white */
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
    max-width: 400px;
    width: 90%;
  }

  h1 {
    font-size: 2em;
    margin-bottom: 10px;
    color: #ffffff;
  }

  p {
    font-size: 1.2em;
    margin-bottom: 30px;
    color: #d0ffd0; /* lighter green */
  }

  input[type="password"] {
    padding: 12px;
    width: 80%;
    margin-bottom: 15px;
    border-radius: 8px;
    border: none;
  }

  input[type="submit"] {
    padding: 12px 25px;
    background-color: #4CAF50;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 1em;
    cursor: pointer;
  }

  input[type="submit"]:hover {
    background-color: #45a049;
  }

  #error {
    color: #ff8080;
    margin-top: 15px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div id="loginBox">
  <h1>GraduateHUNT</h1>
  <p>Coming Soon</p>
  <input type="password" id="password" placeholder="Enter Password"><br>
  <input type="submit" value="Unlock" onclick="checkPassword()">
  <div id="error"></div>
</div>

<script>
  function checkPassword() {
    const input = document.getElementById('password').value;
    const correctPassword = "Tokollo1234@";

    if(input === correctPassword) {
      window.location.href = "homepage.html"; // redirect after unlock
    } else {
      document.getElementById('error').innerText = "Incorrect password. Try again!";
    }
  }

  // Allow Enter key to submit
  document.getElementById("password").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
      checkPassword();
    }
  });
</script>

</body>
</html>
