<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graduate Messages - Graduateinhunt</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background:#f4f7fb; margin:0; padding:0; }
  header { background: linear-gradient(90deg,#1e3a8a,#3b82f6); color:white; padding:20px; text-align:center; border-radius:0 0 20px 20px; }
  header h1 { margin:0; font-size:1.6rem; }
  .container { max-width:700px; margin:30px auto; background:white; padding:25px; border-radius:12px; box-shadow:0 6px 12px rgba(0,0,0,0.1); }
  .btn-home { display:inline-block; margin-bottom:15px; padding:10px 20px; background:#1e3a8a; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:600; transition:0.3s; text-decoration:none; }
  .btn-home:hover { background:#3b82f6; }
  .message-card { padding:15px; margin-bottom:15px; border-radius:10px; border:1px solid #ddd; background:#f9f9f9; }
  .message-header { display:flex; justify-content:space-between; margin-bottom:8px; font-weight:600; }
  .status { font-size:0.9rem; margin-top:8px; font-weight:500; }
  #messageBadge { display:none; background:red; color:white; padding:3px 7px; border-radius:50%; margin-left:10px; font-size:0.8rem; }
  .empty { text-align:center; color:#666; font-style:italic; margin-top:15px; }

  /* Reply and Delete buttons inside messages */
  .btn-group {
    margin-top: 10px;
  }
  .btn-group .reply-btn,
  .btn-group .delete-btn {
    display: inline-block;
    margin-top: 0;
    padding: 8px 16px;
    background: #1e3a8a;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s;
    text-decoration: none;
  }
  .btn-group .reply-btn:hover { background: #3b82f6; }
  .btn-group .delete-btn { background: #c0392b; margin-left:10px; }
  .btn-group .delete-btn:hover { background: #e74c3c; }
</style>
</head>
<body>

<header>
  <h1>Messages <span id="messageBadge">!</span></h1>
</header>

<div class="container">
  <!-- Go Back Home Button -->
  <a href="homepageRegisteredUser.html" class="btn-home">← Go Back Home</a>

  <div id="messagesContainer">
    <p class="empty">Loading messages...</p>
  </div>
</div>

<!-- JS Module -->
<script type="module" src="graduate-message.js"></script>

</body>
</html>
