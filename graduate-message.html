<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraduateInHunt - Messages</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1e3a8a;
    --blue: #3b82f6;
    --ink: #0f172a;
    --muted: #64748b;
    --page: #f4f6fb;
    --line: #e5e9f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--page); color: var(--ink);
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ===== Top bar (same on every page) ===== */
  .topbar { background: #fff; }
  .topbar-inner {
    max-width: 1100px; margin: 0 auto; padding: 0 24px; height: 64px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; letter-spacing: -0.02em; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px; color: #fff; font-weight: 700; font-size: 1.05rem;
    background: linear-gradient(145deg, var(--navy), var(--blue)); display: grid; place-items: center;
  }
  .nav { display: flex; align-items: center; gap: 26px; }
  .nav a, .nav button {
    display: inline-flex; align-items: center; gap: 7px; font: inherit; font-weight: 600; font-size: 0.92rem;
    color: var(--muted); background: none; border: 0; padding: 6px 0; cursor: pointer; transition: color .2s;
  }
  .nav a:hover, .nav button:hover, .nav a.active { color: var(--navy); }

  /* ===== Banner ===== */
  .hero {
    background: linear-gradient(100deg, #1e3a8a 0%, #2d5bc4 55%, #3b82f6 100%);
    color: #fff; padding: 40px 24px 48px; border-radius: 0 0 0 28px;
  }
  .hero-inner { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: center; }
  .hero h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; display: flex; align-items: center; gap: 12px; }
  .hero p { margin: 0 0 18px; max-width: 460px; font-size: 1rem; line-height: 1.5; color: rgba(255,255,255,.9); }
  #messageBadge {
    display: none; background: #ef4444; color: #fff; font-size: .72rem; font-weight: 700; letter-spacing: 0;
    padding: 4px 10px; border-radius: 999px;
  }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn-white { border: 0; cursor: pointer; font: inherit; background: #fff; color: var(--navy); font-weight: 700; font-size: .9rem; padding: 10px 18px; border-radius: 12px; }
  .btn-white:hover:not(:disabled) { box-shadow: 0 8px 20px rgba(10,25,80,.3); }
  .btn-white:disabled { opacity: .75; cursor: default; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; font-weight: 600; font-size: .84rem;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.4);
  }
  .chip[hidden], .btn-white[hidden] { display: none; }
  button.chip { cursor: pointer; font: inherit; font-weight: 600; font-size: .84rem; color: #fff; }
  button.chip:hover { background: rgba(255,255,255,.22); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #fbbf24; }
  .chip.live .dot { background: #4ade80; box-shadow: 0 0 0 4px rgba(74,222,128,.25); }
  .glass {
    display: grid; grid-template-columns: repeat(2, auto); gap: 8px 36px; padding: 18px 28px; border-radius: 20px;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.28); backdrop-filter: blur(6px);
  }
  .stat { text-align: center; }
  .stat b { display: block; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
  .stat span { font-size: .82rem; font-weight: 500; color: rgba(255,255,255,.85); }

  /* ===== Messages ===== */
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 24px 56px; }
  .msg {
    background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 14px;
    display: grid; gap: 12px; transition: box-shadow .2s;
  }
  .msg:hover { box-shadow: 0 8px 22px rgba(30,58,138,.08); }
  .msg.new { border-left: 4px solid var(--blue); background: #fafcff; }
  .msg-head { display: flex; align-items: center; gap: 12px; }
  .av {
    width: 42px; height: 42px; border-radius: 50%; color: #fff; font-weight: 700; display: grid; place-items: center; flex: none;
    background: linear-gradient(145deg, var(--navy), var(--blue));
  }
  .who { font-weight: 700; font-size: 1rem; }
  .when { font-size: .82rem; color: var(--muted); }
  .pill { margin-left: auto; font-weight: 600; font-size: .8rem; padding: 4px 12px; border-radius: 999px; background: #f1f5f9; color: #475569; text-transform: capitalize; }
  .pill.new { background: #dbeafe; color: #1e40af; }
  .job { font-size: .9rem; color: var(--muted); }
  .job a { color: var(--navy); font-weight: 600; }
  .job a:hover { text-decoration: underline; }
  .content { line-height: 1.6; font-size: .95rem; white-space: pre-wrap; word-break: break-word; }
  .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
  .reply-btn, .delete-btn { font: inherit; font-weight: 600; font-size: .88rem; padding: 9px 20px; border-radius: 999px; cursor: pointer; transition: box-shadow .15s, background .15s; }
  .reply-btn { border: 0; color: #fff; background: linear-gradient(145deg, var(--navy), var(--blue)); }
  .reply-btn:hover { box-shadow: 0 6px 16px rgba(30,58,138,.3); }
  .delete-btn { background: #fff; color: #b91c1c; border: 1px solid #fecaca; }
  .delete-btn:hover { background: #fef2f2; }

  .empty { text-align: center; padding: 48px 20px; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 16px; }
  .back {
    display: inline-block; margin-top: 10px; padding: 10px 22px; border-radius: 999px; font-weight: 600; font-size: .92rem;
    background: #fff; border: 1px solid var(--line); transition: box-shadow .15s;
  }
  .back:hover { box-shadow: 0 4px 12px rgba(30,58,138,.12); }

  /* ===== Toast ===== */
  .toast {
    position: fixed; top: 16px; right: 16px; z-index: 100; max-width: min(380px, calc(100% - 32px)); cursor: pointer;
    background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--blue); border-radius: 14px; padding: 14px 18px;
    box-shadow: 0 14px 34px rgba(15,23,42,.18); opacity: 0; transform: translateY(-12px); pointer-events: none;
    transition: opacity .3s, transform .3s;
  }
  .toast.show { opacity: 1; transform: none; pointer-events: auto; }
  .toast b { display: block; font-size: .95rem; margin-bottom: 2px; }
  .toast span { font-size: .87rem; color: var(--muted); }

  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  @media (max-width: 760px) {
    .nav .label { display: none; }
    .nav { gap: 18px; }
    .nav svg.i { width: 22px; height: 22px; }
    .topbar-inner, .wrap { padding-left: 16px; padding-right: 16px; }
    .hero { padding: 32px 16px 40px; }
    .hero-inner { grid-template-columns: 1fr; gap: 22px; }
    .glass { justify-content: space-around; padding: 16px 18px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="homepageRegisteredUser.html"><span class="brand-mark">G</span>GraduateInHunt</a>
    <nav class="nav" aria-label="Main">
      <a href="homepageRegisteredUser.html">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span class="label">Home</span></a>
      <a href="graduate-profile.html">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg><span class="label">My Profile</span></a>
      <a href="browse-jobs.html">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg><span class="label">All Jobs</span></a>
      <button id="logoutBtn" type="button">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span class="label">Logout</span></button>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <div>
      <h1>Messages <span id="messageBadge">New</span></h1>
      <p>Conversations with recruiters. New messages show up here on their own, no refresh needed.</p>
      <div class="hero-actions">
        <button class="btn-white" id="alertsBtn" type="button" hidden>Turn on alerts</button>
        <span class="chip" id="alertsOn" hidden>Alerts on</span>
        <span class="chip" id="liveState"><span class="dot"></span><span id="liveText">Connecting...</span></span>
        <button class="chip" id="soundBtn" type="button" aria-pressed="true">Sound on</button>
      </div>
    </div>
    <div class="glass" aria-label="Message summary">
      <div class="stat"><b id="statConvos">&ndash;</b><span>Conversations</span></div>
      <div class="stat"><b id="statNew">&ndash;</b><span>New</span></div>
    </div>
  </div>
</section>

<main class="wrap">
  <div id="messagesContainer">
    <div class="empty">Loading messages...</div>
  </div>
  <a class="back" href="homepageRegisteredUser.html">Back to home</a>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="graduate-message.js?v=3"></script>
</body>
</html>
