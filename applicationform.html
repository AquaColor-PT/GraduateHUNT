<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply for Job</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Inter', sans-serif;
    background: #f0f4f8;
    margin: 0;
    padding: 0;
    color: #333;
  }

  header {
    background: #1e3a8a;
    color: white;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  header h1 {
    margin: 0;
    font-size: 1.5rem;
  }

  header nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
    font-weight: 500;
    transition: 0.2s;
  }

  header nav a:hover {
    text-decoration: underline;
  }

  main {
    max-width: 650px;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  }

  h2 {
    text-align: center;
    margin-bottom: 15px;
    color: #1e3a8a;
    font-weight: 600;
  }

  .job-title {
    text-align: center;
    margin-bottom: 25px;
    font-size: 1.2rem;
    color: #555;
  }

  label {
    display: block;
    margin-top: 15px;
    font-weight: 600;
  }

  input[type="text"],
  input[type="email"],
  input[type="tel"],
  input[type="file"],
  textarea {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 1rem;
    box-sizing: border-box;
  }

  input[readonly] {
    background: #e2e6ea;
    cursor: not-allowed;
  }

  textarea {
    resize: vertical;
    min-height: 120px;
  }

  .radio-group {
    display: flex;
    gap: 25px;
    margin-top: 10px;
  }

  .radio-group label {
    font-weight: 500;
  }

  button {
    margin-top: 20px;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }

  #previewCV {
    background: #6c63ff;
    color: white;
    margin-right: 10px;
  }

  #previewCV:hover {
    background: #5751d1;
  }

  form button[type="submit"] {
    background: #28a745;
    color: white;
    width: 100%;
  }

  form button[type="submit"]:hover {
    background: #218838;
  }

  @media (max-width: 700px) {
    .radio-group {
      flex-direction: column;
      gap: 10px;
    }
  }
</style>
</head>
<body>

<header>
  <h1>GraduateInHunt</h1>
  <nav>
    <a href="homepageRegisteredUser.html">Home</a>
    <a href="graduate-profile.html">Profile</a>
    <a href="browse-jobs.html">Browse Jobs</a>
  </nav>
</header>

<main>
  <h2>Job Application</h2>
  <div class="job-title" id="jobTitle"></div>

  <form id="applicationForm">
    <label for="name">Full Name</label>
    <input type="text" id="name" readonly>

    <label for="email">Email</label>
    <input type="email" id="email" required>

    <label for="cellnumber">Cell Number</label>
    <input type="tel" id="cellnumber" required>

    <label>Choose CV</label>
    <div class="radio-group">
      <label><input type="radio" name="cvOption" id="cvDefault" value="default" checked> Use Default CV</label>
      <label><input type="radio" name="cvOption" id="cvNew" value="new"> Upload New CV</label>
    </div>

    <input type="file" id="newCV" accept="application/pdf" disabled>

    <label for="coverLetter">Cover Letter (Optional)</label>
    <textarea id="coverLetter" placeholder="Write your cover letter here..."></textarea>

    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button type="button" id="previewCV">Preview CV</button>
      <button type="submit">Submit Application</button>
    </div>
  </form>
</main>

<script type="module" src="applicationform.js"></script>
</body>
</html>
