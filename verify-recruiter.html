<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recruiter Email Verification</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f4f7fb;
  }
  .verify-container {
    text-align: center;
    background: white;
    padding: 30px 40px;
    border-radius: 12px;
    box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
    max-width: 400px;
    width: 100%;
  }
  h2 { margin-bottom: 15px; color: #333; }
  p { margin-bottom: 20px; color: #555; }
  #loginBtn {
    padding: 10px 20px;
    background: #4caf50;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
  }
  .success { color: green; }
  .error { color: red; }
</style>
</head>
<body>

<div class="verify-container">
  <h2 id="status">Verifying...</h2>
  <p id="message">Please wait while we verify your email.</p>
  <a id="loginBtn" href="recruiter-login.html" style="display:none;">Go to Login</a>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const SUPABASE_URL = 'https://euclknvsppptbfclwxqq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1Y2xrbnZzcHBwdGJmY2x3eHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2Mjc2NTQsImV4cCI6MjA3MzIwMzY1NH0.HlGW3kZJ4CPnF2JuZGs_4ObkhxwVFTSedb7O8HHDEag';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const statusEl = document.getElementById('status');
const messageEl = document.getElementById('message');
const loginBtn = document.getElementById('loginBtn');

async function verifyRecruiter() {
  // Supabase sends tokens in the URL hash
  const hashParams = new URLSearchParams(window.location.hash.substring(1));
  const access_token = hashParams.get("access_token");
  const refresh_token = hashParams.get("refresh_token");

  if (!access_token || !refresh_token) {
    statusEl.textContent = 'Verification Failed';
    messageEl.textContent = 'Invalid or expired verification link.';
    statusEl.classList.add('error');
    return;
  }

  try {
    // Set session using tokens
    const { data: sessionData, error: sessionError } = await supabase.auth.setSession({
      access_token,
      refresh_token
    });
    if (sessionError) throw sessionError;

    const user = sessionData.user;

    // Insert into recruiters table only if not already inserted
    const { data: existing } = await supabase
      .from('recruiters')
      .select('id')
      .eq('id', user.id)
      .maybeSingle();

    if (!existing) {
      const { error: insertError } = await supabase.from('recruiters').insert([{
        id: user.id,
        first_name: user.user_metadata.first_name,
        last_name: user.user_metadata.last_name,
        email: user.email,
        company_name: user.user_metadata.company_name,
        registration_number: user.user_metadata.registration_number,
        contact: user.user_metadata.contact,
        verified: false,
        created_at: new Date().toISOString()
      }]);
      if (insertError) throw insertError;
    }

    statusEl.textContent = 'Email Verified!';
    messageEl.textContent = 'Your email has been verified. Now please await approval from the GraduateinHunt team before logging in.';
    statusEl.classList.add('success');
    loginBtn.style.display = 'inline-block';

  } catch (err) {
    console.error('Verification error:', err);
    statusEl.textContent = 'Verification Failed';
    messageEl.textContent = 'There was a problem verifying your email. Please try again.';
    statusEl.classList.add('error');
  }
}

verifyRecruiter();
</script>

</body>
</html>
