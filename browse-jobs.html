<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>Browse Jobs - GraduateInHunt</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  :root {
    color-scheme: light dark;
    --bg: #f4f6fb;
    --surface: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --link: #1e3a8a;
    --accent: #f5b800;
    --chip-bg: #eef2ff;
    --topbar: rgba(255, 255, 255, 0.88);
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.06);
    --shadow-hover: 0 2px 4px rgba(15, 23, 42, 0.08), 0 16px 32px rgba(15, 23, 42, 0.12);
    --new-bg: #dcfce7;
    --new-fg: #166534;
    --notice-bg: #fff8e1;
    --notice-fg: #6b5200;
    --error: #dc2626;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220;
      --surface: #121b30;
      --text: #e6eaf3;
      --muted: #97a3b9;
      --border: #223052;
      --link: #93c5fd;
      --chip-bg: #1a2745;
      --topbar: rgba(11, 18, 32, 0.88);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
      --shadow-hover: 0 2px 4px rgba(0, 0, 0, 0.4), 0 16px 32px rgba(0, 0, 0, 0.4);
      --new-bg: rgba(34, 197, 94, 0.15);
      --new-fg: #86efac;
      --notice-bg: rgba(245, 184, 0, 0.12);
      --notice-fg: #f5d56a;
      --error: #f87171;
    }
  }

  body {
    margin: 0;
    font-family: 'Inter', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--topbar);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding-top: env(safe-area-inset-top, 0px);
  }
  .topbar-inner {
    max-width: 1000px;
    margin: 0 auto;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text);
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: -0.02em;
  }
  .brand-mark {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    color: #fff;
    font-weight: 800;
  }

  .main-nav { display: flex; gap: 4px; }
  .nav-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    color: var(--muted);
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    transition: background 0.2s, color 0.2s;
  }
  .nav-link:hover { background: var(--chip-bg); color: var(--link); }
  .nav-link svg { width: 18px; height: 18px; }

  /* ---------- Hero ---------- */
  .hero {
    background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
    color: #fff;
    padding: 34px 16px 40px;
    text-align: center;
    border-radius: 0 0 28px 28px;
  }
  .hero-inner { max-width: 640px; margin: 0 auto; }
  .hero h1 {
    margin: 0 0 8px;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  .hero p { margin: 0; opacity: 0.9; font-size: 1rem; }

  .search { position: relative; margin-top: 22px; }
  .search svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    color: #64748b;
    pointer-events: none;
  }
  .search input {
    width: 100%;
    padding: 15px 16px 15px 46px;
    border: none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 1rem;
    color: #0f172a;
    background: #fff;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
    -webkit-appearance: none;
    appearance: none;
  }
  .search input::placeholder { color: #94a3b8; }
  .search input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- Content ---------- */
  .container { max-width: 1000px; margin: 0 auto; padding: 22px 16px 48px; }

  .notice {
    background: var(--notice-bg);
    border: 1px solid var(--accent);
    color: var(--notice-fg);
    border-radius: 12px;
    padding: 12px 16px;
    margin: 0 0 18px;
    font-size: 0.93rem;
  }

  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin: 0 -16px;
    padding-left: 16px;
    padding-right: 16px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  @media (min-width: 720px) {
    .chips { flex-wrap: wrap; overflow: visible; margin: 0; padding-left: 0; padding-right: 0; }
  }
  .chip {
    flex: 0 0 auto;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .chip:hover { border-color: #3b82f6; }
  .chip.active {
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    color: #fff;
    border-color: transparent;
  }
  .chip:focus-visible, .btn:focus-visible, .viewMore:focus-visible, .nav-link:focus-visible, .brand:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  .results-bar {
    margin: 16px 2px 12px;
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 600;
    min-height: 1.4em;
  }

  .job-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 16px;
    grid-template-columns: 1fr;
  }
  @media (min-width: 860px) {
    .job-list { grid-template-columns: 1fr 1fr; }
  }

  /* ---------- Job card ---------- */
  .job-card {
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    box-shadow: var(--shadow);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .job-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }

  .card-head { display: flex; gap: 14px; align-items: flex-start; }
  .avatar {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 46px;
    height: 46px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 1.2rem;
  }
  .card-title { min-width: 0; }
  .card-title h4 {
    margin: 0;
    font-size: 1.08rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }
  .card-title .company { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }

  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 700;
    background: var(--chip-bg);
    color: var(--link);
  }
  .badge.new { background: var(--new-bg); color: var(--new-fg); }

  .meta { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 0.88rem; }
  .meta-item { display: flex; gap: 8px; align-items: flex-start; }
  .meta-item .icon { flex: 0 0 auto; margin-top: 2px; display: inline-flex; }
  .meta-item strong { color: var(--text); font-weight: 600; }

  .desc {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
    white-space: pre-line;
    overflow-wrap: anywhere;
  }
  .viewMore {
    align-self: flex-start;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--link);
    cursor: pointer;
    text-decoration: underline;
  }

  .card-foot {
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .card-foot small { color: var(--muted); font-size: 0.8rem; }

  .btn {
    padding: 10px 22px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    color: #fff;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(30, 58, 138, 0.3); }
  .btn:disabled, .btn:disabled:hover {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* ---------- Empty / error / loading states ---------- */
  .job-list li.state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 48px 20px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 18px;
    color: var(--muted);
  }
  .state .icon { display: inline-flex; color: var(--link); margin-bottom: 10px; }
  .state .icon svg { width: 40px; height: 40px; }
  .state h4 { margin: 0 0 6px; color: var(--text); font-size: 1.1rem; }
  .state p { margin: 0; }
  .state a { color: var(--link); font-weight: 700; }
  .state.error .icon, .state.error h4 { color: var(--error); }

  .skeleton .sk { background: var(--border); border-radius: 8px; animation: pulse 1.4s ease-in-out infinite; }
  .sk-title { height: 20px; width: 60%; }
  .sk-line { height: 12px; width: 90%; }
  .sk-line.short { width: 55%; }
  .sk-btn { height: 38px; width: 110px; border-radius: 12px; margin-top: 6px; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) {
    .skeleton .sk { animation: none; }
    .job-card, .btn, .chip { transition: none; }
    .job-card:hover { transform: none; }
  }

  /* ---------- Phones: bottom navigation ---------- */
  @media (max-width: 640px) {
    body { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
    .main-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 60;
      justify-content: space-around;
      gap: 0;
      background: var(--topbar);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
    }
    .nav-link {
      flex: 1;
      flex-direction: column;
      gap: 2px;
      padding: 6px 4px;
      border-radius: 12px;
      font-size: 0.72rem;
    }
    .hero { padding: 26px 16px 32px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="homepageRegisteredUser.html">
      <span class="brand-mark" aria-hidden="true">G</span>
      <span>GraduateInHunt</span>
    </a>

    <nav class="main-nav" aria-label="Main">
      <a class="nav-link" href="homepageRegisteredUser.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
      </a>
      <a class="nav-link" href="graduate-profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span>My Profile</span>
      </a>
      <a class="nav-link" href="alljobs.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
        <span>All Jobs</span>
      </a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <h1>Find your next opportunity</h1>
    <p>Jobs, learnerships and internships that match your qualification.</p>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="jobTitleSearch" placeholder="Search by job title..." aria-label="Search by job title" autocomplete="off">
    </div>
  </div>
</section>

<main class="container">
  <p id="notice" class="notice" role="status" hidden></p>

  <div class="chips" id="typeChips" role="group" aria-label="Filter by job type">
    <button type="button" class="chip active" data-type="" aria-pressed="true">All</button>
    <button type="button" class="chip" data-type="Internship" aria-pressed="false">Internship</button>
    <button type="button" class="chip" data-type="Learnership" aria-pressed="false">Learnership</button>
    <button type="button" class="chip" data-type="Training Program" aria-pressed="false">Training Program</button>
    <button type="button" class="chip" data-type="Part-time" aria-pressed="false">Part-time</button>
    <button type="button" class="chip" data-type="Permanent" aria-pressed="false">Permanent</button>
    <button type="button" class="chip" data-type="Contract" aria-pressed="false">Contract</button>
  </div>

  <div class="results-bar" id="resultCount" aria-live="polite"></div>

  <ul id="publicJobList" class="job-list"></ul>
</main>

<script type="module" src="browse-jobs.js"></script>
</body>
</html>
