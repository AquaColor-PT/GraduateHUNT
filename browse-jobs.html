<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Jobs - GraduateInHunt</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  body { 
    font-family: 'Inter', Arial, sans-serif; 
    background: #f5f7fa; 
    margin: 0; 
    padding: 0; 
  }

  header {
    background: linear-gradient(90deg,#1e3a8a,#3b82f6);
    color: white;
    padding: 25px 20px;
    text-align: center;
    border-radius: 0 0 20px 20px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.1);
  }

  header h1 { 
    margin: 0; 
    font-weight: 700; 
    font-size: 1.8rem; 
  }

  /* Navigation: horizontal, and wraps neatly on very small phones
     (replaces the old transform: scale() trick, which shrank the buttons
     but left the layout width unchanged) */
  nav ul {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px 20px;
    list-style: none;
    margin: 15px 0 0 0;
    padding: 0;
  }

  nav ul li a { text-decoration: none; }

  .blue-btn {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    color: white;
    text-decoration: none;
    background: linear-gradient(145deg, #1e3a8a, #3b82f6);
    border: none;
    cursor: pointer;
    transition: 0.3s;
    white-space: nowrap;
    font-size: 1rem;
    font-family: inherit;
  }

  .blue-btn:hover { background: linear-gradient(145deg, #16275f, #2563eb); }

  /* Disabled state ("Already Applied") - done in CSS because an inline
     background-color cannot override the gradient above */
  .blue-btn:disabled,
  .blue-btn:disabled:hover {
    background: #ccc;
    color: #666;
    cursor: not-allowed;
  }

  .blue-btn:focus-visible,
  .viewMore:focus-visible,
  .filters select:focus-visible,
  .filters input:focus-visible {
    outline: 3px solid #f5b800;
    outline-offset: 2px;
  }

  .container {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 15px;
  }

  h3 { 
    margin-bottom: 20px; 
    color: #1e3a8a; 
    text-align: center; 
    font-weight: 600; 
  }

  .filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 25px;
    justify-content: center;
  }

  .filters select, .filters input, .filters button {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 0.95rem;
    font-family: inherit;
  }

  .filters input[type="text"] { flex: 1 1 220px; max-width: 360px; }

  .notice {
    background: #fff8e1;
    border: 1px solid #f5b800;
    color: #6b5200;
    border-radius: 10px;
    padding: 12px 16px;
    margin: 0 0 20px 0;
    font-size: 0.95rem;
  }
  .notice[hidden] { display: none; }

  #publicJobList {
    list-style: none;
    padding: 0;
  }

  #publicJobList li {
    background: white;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  #publicJobList li:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.12);
  }

  #publicJobList li.loading { color: #555; text-align: center; }
  #publicJobList li.error { color: #b00020; border-left: 5px solid #b00020; }

  #publicJobList h4 {
    margin: 0 0 10px 0;
    color: #1e3a8a;
    font-weight: 600;
  }

  #publicJobList div, #publicJobList p { 
    color: #555; 
    margin-bottom: 8px; 
    font-size: 0.95rem; 
  }

  #publicJobList .desc { white-space: pre-line; margin: 8px 0 12px 0; line-height: 1.4; }

  #publicJobList small { display: block; color: #777; margin: 6px 0 4px 0; }

  .applyBtn { display: inline-block; margin-top: 10px; }

  .viewMore { 
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-size: 0.85rem;
    color: #1e3a8a; 
    cursor: pointer; 
    font-weight: 600; 
    display: inline-block; 
    margin: 0 0 6px 0;
    text-decoration: underline;
  }

  /* ---- Styles merged from the old stylesheet ----
     Kept: the rules that don't fight this page's design.
     (.job-card and form styles aren't used on this page yet, but are
     here so they're ready for other pages.) */
  .job-card { 
    background: white; 
    padding: 20px; 
    margin-bottom: 20px; 
    border-radius: 8px; 
    box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
  }
  .job-card h3 { margin: 0; }
  .job-card p { margin: 5px 0; }

  form { 
    display: flex; 
    flex-direction: column; 
    gap: 10px; 
    margin-top: 10px; 
  }
  form input, form textarea { 
    padding: 10px; 
    border-radius: 5px; 
    border: 1px solid #ccc; 
    width: 100%; 
  }

  @media (max-width: 480px) {
    header h1 { font-size: 1.5rem; }
    .blue-btn { padding: 9px 16px; font-size: 0.95rem; }
    #publicJobList li { padding: 20px 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>GraduateInHunt - Jobs</h1>
  <nav>
    <ul>
      <li><a href="homepageRegisteredUser.html" class="blue-btn">Home</a></li>
      <li><a href="graduate-profile.html" class="blue-btn">My Profile</a></li>
      <li><a href="alljobs.html" class="blue-btn">All Jobs</a></li>
    </ul>
  </nav>
</header>

<main class="container">
  <h3>Available Jobs</h3>

  <p id="notice" class="notice" role="status" hidden></p>

  <div class="filters">
    <select id="jobTypeFilter" aria-label="Filter by job type">
      <option value="">All Job Types</option>
      <option value="Internship">Internship</option>
      <option value="Learnership">Learnership</option>
      <option value="Training Program">Training Program</option>
      <option value="Part-time">Part-time</option>
      <option value="Permanent">Permanent</option>
      <option value="Contract">Contract</option>
    </select>

    <input type="text" id="jobTitleSearch" placeholder="Search by job title..." aria-label="Search by job title">
    <button id="searchBtn" class="blue-btn" type="button">Search</button>
  </div>

  <ul id="publicJobList" aria-live="polite">
    <li class="loading">Loading jobs...</li>
  </ul>
</main>

<script type="module" src="browse-jobs.js"></script>
</body>
</html>
