<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Jobs - GraduateInHunt</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { 
    font-family: 'Inter', sans-serif; 
    background: #f5f7fa; 
    margin: 0; 
    padding: 0; 
  }

  header {
    background: linear-gradient(90deg,#1e3a8a,#3b82f6);
    color: white;
    padding: 25px 20px;
    text-align: center;
    border-radius: 0 0 20px 20px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.1);
  }

  header h1 { 
    margin: 0; 
    font-weight: 700; 
    font-size: 1.8rem; 
  }

  /* ✅ Keep navigation always horizontal */
  nav ul {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    list-style: none;
    margin: 15px 0 0 0;
    padding: 0;
    flex-wrap: nowrap; /* Prevent stacking */
  }

  nav ul li a {
    text-decoration: none;
  }

  .blue-btn {
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    color: white;
    text-decoration: none;
    background: linear-gradient(145deg, #1e3a8a, #3b82f6);
    border: none;
    cursor: pointer;
    transition: 0.3s;
    white-space: nowrap;
    font-size: 1rem;
  }

  .blue-btn:hover {
    background: linear-gradient(145deg, #16275f, #2563eb);
  }

  .container {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 15px;
  }

  h3 { 
    margin-bottom: 20px; 
    color: #1e3a8a; 
    text-align:center; 
    font-weight:600; 
  }

  .filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 25px;
    justify-content: center;
  }

  .filters select, .filters input, .filters button {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 0.95rem;
  }

  #publicJobList {
    list-style: none;
    padding: 0;
  }

  #publicJobList li {
    background: white;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  #publicJobList li:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.12);
  }

  #publicJobList h4 {
    margin: 0 0 10px 0;
    color: #1e3a8a;
    font-weight: 600;
  }

  #publicJobList div, #publicJobList p { 
    color:#555; 
    margin-bottom:8px; 
    font-size:0.95rem; 
  }

  .applyBtn { display:inline-block; margin-top:10px; }
  .viewMore { 
    color:#1e3a8a; 
    cursor:pointer; 
    font-weight:600; 
    display:inline-block; 
    margin-top:5px; 
  }

  /* ✅ Scale the whole header slightly on smaller devices but keep layout */
  @media (max-width: 768px) {
    nav ul {
      gap: 12px;
      transform: scale(0.95);
    }
  }

  @media (max-width: 480px) {
    nav ul {
      transform: scale(0.85);
    }
  }
</style>
</head>
<body>

<header>
  <h1>GraduateInHunt - Jobs</h1>
  <nav>
    <ul>
      <li><a href="homepageRegisteredUser.html" class="blue-btn">Home</a></li>
      <li><a href="graduate-profile.html" class="blue-btn">My Profile</a></li>
      <li><a href="alljobs.html" class="blue-btn">All Jobs</a></li>
    </ul>
  </nav>
</header>

<section class="container">
  <h3>Available Jobs</h3>

  <div class="filters">
    <select id="jobTypeFilter">
      <option value="">All Job Types</option>
      <option value="Internship">Internship</option>
      <option value="Learnership">Learnership</option>
      <option value="Training Program">Training Program</option>
      <option value="Part-time">Part-time</option>
      <option value="Permanent">Permanent</option>
      <option value="Contract">Contract</option>
    </select>

    <input type="text" id="jobTitleSearch" placeholder="Search by job title...">
    <button id="searchBtn" class="blue-btn">Search</button>
  </div>

  <ul id="publicJobList">
    <li class="loading">Loading jobs...</li>
  </ul>
</section>

<script type="module" src="browse-jobs.js"></script>
</body>
</html>
