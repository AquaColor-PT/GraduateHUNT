<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>Browse Jobs - GraduateInHunt</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  :root {
    color-scheme: light dark;
    --bg: #f4f6fb;
    --surface: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --link: #1e3a8a;
    --accent: #f5b800;
    --chip-bg: #eef2ff;
    --topbar: rgba(255, 255, 255, 0.88);
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.06);
    --shadow-hover: 0 2px 4px rgba(15, 23, 42, 0.08), 0 16px 32px rgba(15, 23, 42, 0.12);
    --new-bg: #dcfce7;
    --new-fg: #166534;
    --notice-bg: #fff8e1;
    --notice-fg: #6b5200;
    --error: #dc2626;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220;
      --surface: #121b30;
      --text: #e6eaf3;
      --muted: #97a3b9;
      --border: #223052;
      --link: #93c5fd;
      --chip-bg: #1a2745;
      --topbar: rgba(11, 18, 32, 0.88);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
      --shadow-hover: 0 2px 4px rgba(0, 0, 0, 0.4), 0 16px 32px rgba(0, 0, 0, 0.4);
      --new-bg: rgba(34, 197, 94, 0.15);
      --new-fg: #86efac;
      --notice-bg: rgba(245, 184, 0, 0.12);
      --notice-fg: #f5d56a;
      --error: #f87171;
    }
  }

  body {
    margin: 0;
    font-family: 'Inter', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--topbar);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding-top: env(safe-area-inset-top, 0px);
  }
  .topbar-inner {
    max-width: 1000px;
    margin: 0 auto;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text);
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: -0.02em;
  }
  .brand-mark {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    color: #fff;
    font-weight: 800;
  }

  .main-nav { display: flex; gap: 4px; }
  .nav-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    color: var(--muted);
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    transition: background 0.2s, color 0.2s;
  }
  .nav-link:hover { background: var(--chip-bg); color: var(--link); }
  .nav-link svg { width: 18px; height: 18px; }

  /* ---------- Hero ---------- */
  .hero {
    background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
    color: #fff;
    padding: 34px 16px 40px;
    text-align: center;
    border-radius: 0 0 28px 28px;
  }
  .hero-inner { max-width: 640px; margin: 0 auto; }
  .hero h1 {
    margin: 0 0 8px;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  .hero p { margin: 0; opacity: 0.9; font-size: 1rem; }

  .search { position: relative; margin-top: 22px; }
  .search svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    color: #64748b;
    pointer-events: none;
  }
  .search input {
    width: 100%;
    padding: 15px 16px 15px 46px;
    border: none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 1rem;
    color: #0f172a;
    background: #fff;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
    -webkit-appearance: none;
    appearance: none;
  }
  .search input::placeholder { color: #94a3b8; }
  .search input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- Content ---------- */
  .container { max-width: 1000px; margin: 0 auto; padding: 22px 16px 48px; }

  .notice {
    background: var(--notice-bg);
    border: 1px solid var(--accent);
    color: var(--notice-fg);
    border-radius: 12px;
    padding: 12px 16px;
    margin: 0 0 18px;
    font-size: 0.93rem;
  }

  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin: 0 -16px;
    padding-left: 16px;
    padding-right: 16px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  @media (min-width: 720px) {
    .chips { flex-wrap: wrap; overflow: visible; margin: 0; padding-left: 0; padding-right: 0; }
  }
  .chip {
    flex: 0 0 auto;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .chip:hover { border-color: #3b82f6; }
  .chip.active {
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    color: #fff;
    border-color: transparent;
  }
  .chip:focus-visible, .btn:focus-visible, .viewMore:focus-visible, .nav-link:focus-visible, .brand:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  .results-bar {
    margin: 16px 2px 12px;
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 600;
    min-height: 1.4em;
  }

  .job-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 16px;
    grid-template-columns: 1fr;
  }
  @media (min-width: 860px) {
    .job-list { grid-template-columns: 1fr 1fr; }
  }

  /* ---------- Job card ---------- */
  .job-card {
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    box-shadow: var(--shadow);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .job-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }

  .card-head { display: flex; gap: 14px; align-items: flex-start; }
  .avatar {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 46px;
    height: 46px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 1.2rem;
  }
  .card-title { min-width: 0; }
  .card-title h4 {
    margin: 0;
    font-size: 1.08rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }
  .card-title .company { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }

  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 700;
    background: var(--chip-bg);
    color: var(--link);
  }
  .badge.new { background: var(--new-bg); color: var(--new-fg); }

  .meta { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 0.88rem; }
  .meta-item { display: flex; gap: 8px; align-items: flex-start; }
  .meta-item .icon { flex: 0 0 auto; margin-top: 2px; display: inline-flex; }
  .meta-item strong { color: var(--text); font-weight: 600; }

  .desc {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
    white-space: pre-line;
    overflow-wrap: anywhere;
  }
  .viewMore {
    align-self: flex-start;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--link);
    cursor: pointer;
    text-decoration: underline;
  }

  .card-foot {
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
