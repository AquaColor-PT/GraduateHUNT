<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Jobs - Graduateinhunt</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { 
    font-family: 'Inter', sans-serif; 
    background-color: #f4f7fb; 
    margin: 0; 
    padding: 0; 
  }

  header {
    background-color: #1e3a8a; 
    color: white; 
    padding: 30px 15px; 
    text-align: center; 
    border-radius: 0 0 20px 20px;
  }

  header h1 {
    margin: 0;
    font-weight: 600;
    font-size: 1.8rem;
  }

  nav ul {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 15px 0 0;
    margin: 0;
    list-style: none;
    flex-wrap: wrap;
  }

  nav ul li a {
    color: white;
    text-decoration: none;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 8px;
    transition: background 0.3s;
  }

  nav ul li a:hover {
    background-color: #16275f;
  }

  .container {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 15px;
  }

  h3 {
    margin-bottom: 25px;
    color: #1e3a8a;
    text-align: center;
    font-weight: 600;
  }

  #publicJobList {
    list-style: none;
    padding: 0;
  }

  #publicJobList li {
    background: white;
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.08);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  #publicJobList li:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 18px rgba(0,0,0,0.15);
  }

  #publicJobList h4 {
    margin: 0 0 10px 0;
    color: #1e3a8a;
    font-weight: 600;
  }

  #publicJobList div, #publicJobList p {
    color: #555;
    margin-bottom: 8px;
    font-size: 0.95rem;
  }

  .applyBtn {
    display: inline-block;
    padding: 12px 22px;
    background-color: #28a745;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.3s, transform 0.2s;
    margin-top: 10px;
  }

  .applyBtn:hover {
    background-color: #218838;
    transform: translateY(-2px);
  }

  @media (max-width: 500px) {
    nav ul {
      flex-direction: column;
      gap: 10px;
    }
  }
</style>
</head>
<body>

<header>
  <h1>Graduateinhunt - Jobs</h1>
  <nav>
    <ul>
      <li><a href="homepageRegisteredUser.html">Home</a></li>
      <li><a href="browse-jobs.html">Browse Jobs</a></li>
      <li><a href="graduate-profile.html">My Profile</a></li>
    </ul>
  </nav>
</header>

<section class="container">
  <h3>Available Jobs</h3>
  <ul id="publicJobList">
    <li class="loading">Loading jobs...</li>
  </ul>
</section>

<script type="module" src="browse-jobs.js"></script>
</body>
</html>
