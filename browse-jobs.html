<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Jobs - GraduateInHunt</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    font-family: 'Inter', Arial, sans-serif;
    background: #f5f7fa;
    color: #0f172a;
    margin: 0;
    padding: 0;
    line-height: 1.5;
  }

  /* ---------- Header (same as before) ---------- */
  header {
    background: linear-gradient(90deg,#1e3a8a,#3b82f6);
    color: white;
    padding: 25px 20px;
    text-align: center;
    border-radius: 0 0 20px 20px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.1);
  }

  header h1 {
    margin: 0;
    font-weight: 700;
    font-size: 1.8rem;
  }

  nav ul {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px 20px;
    list-style: none;
    margin: 15px 0 0 0;
    padding: 0;
  }

  nav ul li a { text-decoration: none; }

  .blue-btn {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    color: white;
    text-decoration: none;
    background: linear-gradient(145deg, #1e3a8a, #3b82f6);
    border: none;
    cursor: pointer;
    transition: 0.3s;
    white-space: nowrap;
    font-size: 1rem;
    font-family: inherit;
  }
  .blue-btn:hover { background: linear-gradient(145deg, #16275f, #2563eb); }

  .blue-btn:focus-visible,
  .chip:focus-visible,
  .viewMore:focus-visible,
  .search input:focus-visible {
    outline: 3px solid #f5b800;
    outline-offset: 2px;
  }

  /* ---------- Content ---------- */
  .container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 26px 16px 48px;
  }

  .intro { text-align: center; margin-bottom: 20px; }
  .intro h2 {
    margin: 0 0 4px;
    color: #1e3a8a;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .intro p { margin: 0; color: #64748b; font-size: 0.95rem; }

  .notice {
    background: #fff8e1;
    border: 1px solid #f5b800;
    color: #6b5200;
    border-radius: 12px;
    padding: 12px 16px;
    margin: 0 0 18px;
    font-size: 0.93rem;
  }

  .search { position: relative; max-width: 560px; margin: 0 auto 18px; }
  .search svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    color: #64748b;
    pointer-events: none;
  }
  .search input {
    width: 100%;
    padding: 14px 16px 14px 46px;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    font-family: inherit;
    font-size: 1rem;
    color: #0f172a;
    background: #fff;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
    -webkit-appearance: none;
    appearance: none;
  }
  .search input::placeholder { color: #94a3b8; }

  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 16px 8px;
    margin: 0 -16px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  @media (min-width: 720px) {
    .chips { flex-wrap: wrap; justify-content: center; overflow: visible; margin: 0; padding: 2px 0 8px; }
  }
  .chip {
    flex: 0 0 auto;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid #e2e8f0;
    background: #fff;
    color: #0f172a;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .chip:hover { border-color: #3b82f6; }
  .chip.active {
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    color: #fff;
    border-color: transparent;
  }

  .results-bar {
    margin: 14px 2px 12px;
    color: #64748b;
    font-size: 0.9rem;
    font-weight: 600;
    min-height: 1.4em;
  }

  .job-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 16px;
    grid-template-columns: 1fr;
  }
  @media (min-width: 860px) {
    .job-list { grid-template-columns: 1fr 1fr; }
  }

  /* ---------- Job card ---------- */
  .job-card {
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.06);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .job-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 2px 4px rgba(15, 23, 42, 0.08), 0 16px 32px rgba(15, 23, 42, 0.12);
  }

  .card-head { display: flex; gap: 14px; align-items: flex-start; }
  .avatar {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 46px;
    height: 46px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 1.2rem;
  }
  .card-title { min-width: 0; }
  .card-title h4 {
    margin: 0;
    font-size: 1.08rem;
    font-weight: 700;
    color: #1e3a8a;
    overflow-wrap: anywhere;
  }
  .card-title .company { margin: 2px 0 0; color: #64748b; font-size: 0.9rem; }

  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 700;
    background: #eef2ff;
    color: #1e3a8a;
  }
  .badge.new { background: #dcfce7; color: #166534; }

  .meta { display: flex; flex-direction: column; gap: 6px; color: #64748b; font-size: 0.88rem; }
  .meta-item { display: flex; gap: 8px; align-items: flex-start; }
  .meta-item .icon { flex: 0 0 auto; margin-top: 2px; display: inline-flex; }
  .meta-item strong { color: #0f172a; font-weight: 600; }

  .desc {
    margin: 0;
    color: #64748b;
    font-size: 0.92rem;
    white-space: pre-line;
    overflow-wrap: anywhere;
  }
  .viewMore {
    align-self: flex-start;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    color: #1e3a8a;
    cursor: pointer;
    text-decoration: underline;
  }

  .card-foot {
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid #e2e8f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .card-foot small { color: #64748b; font-size: 0.8rem; }

  .btn {
    padding: 10px 22px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    color: #fff;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(30, 58, 138, 0.3); }
  .btn:focus-visible { outline: 3px solid #f5b800; outline-offset: 2px; }
  .btn:disabled, .btn:disabled:hover {
    background: #e2e8f0;
    color: #64748b;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* ---------- Empty / error / loading states ---------- */
  .job-list li.state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 44px 20px;
    background: #fff;
    border: 1px dashed #cbd5e1;
    border-radius: 18px;
    color: #64748b;
  }
  .state .icon { display: inline-flex; color: #1e3a8a; margin-bottom: 10px; }
  .state .icon svg { width: 40px; height: 40px; }
  .state h4 { margin: 0 0 6px; color: #0f172a; font-size: 1.1rem; }
  .state p { margin: 0; overflow-wrap: anywhere; }
  .state a { color: #1e3a8a; font-weight: 700; }
  .state.error { border-color: #fca5a5; }
  .state.error .icon, .state.error h4 { color: #dc2626; }

  .skeleton .sk { background: #e2e8f0; border-radius: 8px; animation: pulse 1.4s ease-in-out infinite; }
  .sk-title { height: 20px; width: 60%; }
  .sk-line { height: 12px; width: 90%; }
  .sk-line.short { width: 55%; }
  .sk-btn { height: 38px; width: 110px; border-radius: 12px; margin-top: 6px; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) {
    .skeleton .sk { animation: none; }
    .job-card, .btn, .chip { transition: none; }
    .job-card:hover { transform: none; }
  }

  @media (max-width: 480px) {
    header h1 { font-size: 1.5rem; }
    .blue-btn { padding: 9px 16px; font-size: 0.95rem; }
    .job-card { padding: 18px 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>GraduateInHunt - Jobs</h1>
  <nav>
    <ul>
      <li><a href="homepageRegisteredUser.html" class="blue-btn">Home</a></li>
      <li><a href="graduate-profile.html" class="blue-btn">My Profile</a></li>
      <li><a href="alljobs.html" class="blue-btn">All Jobs</a></li>
    </ul>
  </nav>
</header>

<main class="container">
  <div class="intro">
    <h2>Available Jobs</h2>
    <p>Jobs, learnerships and internships that match your qualification.</p>
  </div>

  <p id="notice" class="notice" role="status" hidden></p>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="search" id="jobTitleSearch" placeholder="Search by job title..." aria-label="Search by job title" autocomplete="off">
  </div>

  <div class="chips" id="typeChips" role="group" aria-label="Filter by job type">
    <button type="button" class="chip active" data-type="" aria-pressed="true">All</button>
    <button type="button" class="chip" data-type="Internship" aria-pressed="false">Internship</button>
    <button type="button" class="chip" data-type="Learnership" aria-pressed="false">Learnership</button>
    <button type="button" class="chip" data-type="Training Program" aria-pressed="false">Training Program</button>
    <button type="button" class="chip" data-type="Part-time" aria-pressed="false">Part-time</button>
    <button type="button" class="chip" data-type="Permanent" aria-pressed="false">Permanent</button>
    <button type="button" class="chip" data-type="Contract" aria-pressed="false">Contract</button>
  </div>

  <div class="results-bar" id="resultCount" aria-live="polite"></div>

  <ul id="publicJobList" class="job-list">
    <li class="state"><h4>Loading jobs...</h4></li>
  </ul>

  <noscript><p class="notice">This page needs JavaScript to show jobs. Please turn it on in your browser.</p></noscript>
</main>

<!-- If anything fails, show the reason on the page instead of leaving it blank -->
<script>
  function showFatal(message) {
    var list = document.getElementById('publicJobList');
    if (!list) return;
    list.innerHTML = '';
    var li = document.createElement('li');
    li.className = 'state error';
    var h = document.createElement('h4');
    h.textContent = 'This page hit a problem';
    var p = document.createElement('p');
    p.textContent = message;
    li.appendChild(h);
    li.appendChild(p);
    list.appendChild(li);
  }
  window.addEventListener('error', function (e) { showFatal(e.message || 'Unknown error'); });
  window.addEventListener('unhandledrejection', function (e) {
    showFatal((e.reason && e.reason.message) || 'Unknown error');
  });
</script>

<script type="module" src="browse-jobs.js"
  onerror="showFatal('browse-jobs.js could not be loaded. Check that it is in the same folder as this page and has been uploaded.')"></script>
</body>
</html>
