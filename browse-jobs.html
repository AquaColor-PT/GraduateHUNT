<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Jobs - Graduateinhunt</title>
<link rel="stylesheet" href="browse-jobs.css">
<style>
  body { font-family: Arial, sans-serif; background-color: #f9f9f9; margin:0; padding:0; }
  .container { max-width:900px; margin:20px auto; padding:0 15px; }
  h3 { margin-bottom:20px; color:#333; }
  #publicJobList { list-style:none; padding:0; }
  #publicJobList li { background:#fff; border-radius:10px; padding:20px; margin-bottom:20px; box-shadow:0 3px 6px rgba(0,0,0,0.1); transition:0.2s; }
  #publicJobList li:hover { transform:translateY(-2px); box-shadow:0 5px 12px rgba(0,0,0,0.15); }
  #publicJobList h4 { margin:0 0 10px 0; color:#0073e6; }
  #publicJobList div, #publicJobList p { color:#555; margin-bottom:6px; }
  .applyBtn { display:inline-block; padding:10px 18px; background-color:#28a745; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold; transition:0.2s; margin-top:10px; }
  .applyBtn:hover { background-color:#218838; transform:translateY(-2px); }
</style>
</head>
<body>

<header>
  <div class="container">
    <h1>Graduateinhunt - Jobs</h1>
    <nav>
      <ul>
        <li><a href="homepageRegisteredUser.html">Home</a></li>
        <li><a href="browse-jobs.html">Browse Jobs</a></li>
        <li><a href="graduate-profile.html">My Profile</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="container">
  <h3>Available Jobs</h3>
  <ul id="publicJobList">
    <li class="loading">Loading jobs...</li>
  </ul>
</section>

<script type="module" src="browse-jobs.js"></script>
</body>
</html>
