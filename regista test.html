<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruiter Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      background: #007bff;
      color: white;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
    }
    .success {
      background: #d4edda;
      color: #155724;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
    }
    .info {
      background: #fff3cd;
      color: #856404;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Recruiter Registration</h2>
    <input type="text" id="firstName" placeholder="First Name" />
    <input type="text" id="lastName" placeholder="Last Name" />
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <input type="text" id="company" placeholder="Company Name" />
    <input type="text" id="registrationNumber" placeholder="Registration Number" />
    <input type="text" id="contact" placeholder="Contact Number" />
    <button id="registerBtn">Register</button>
    <div id="message" class="message"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
const SUPABASE_URL = 'https://euclknvsppptbfclwxqq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1Y2xrbnZzcHBwdGJmY2x3eHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2Mjc2NTQsImV4cCI6MjA3MzIwMzY1NH0.HlGW3kZJ4CPnF2JuZGs_4ObkhxwVFTSedb7O8HHDEag';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const firstNameInput = document.getElementById('firstName');
    const lastNameInput = document.getElementById('lastName');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const companyInput = document.getElementById('company');
    const registrationNumberInput = document.getElementById('registrationNumber');
    const contactInput = document.getElementById('contact');
    const registerBtn = document.getElementById('registerBtn');
    const messageEl = document.getElementById('message');

    registerBtn.addEventListener('click', async () => {
      messageEl.textContent = '';
      messageEl.className = 'message';

      const first_name = firstNameInput.value.trim();
      const last_name = lastNameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const company_name = companyInput.value.trim();
      const registration_number = registrationNumberInput.value.trim();
      const contact = contactInput.value.trim();

      if (!first_name || !last_name || !email || !password || !company_name || !registration_number || !contact) {
        messageEl.textContent = 'Please fill in all fields.';
        messageEl.classList.add('error');
        return;
      }

      try {
        // 1. Sign up user with email verification
        const { data: authData, error: authError } = await supabase.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: window.location.origin + "/verified.html" // redirect after verification
          }
        });

        if (authError) {
          messageEl.textContent = authError.message;
          messageEl.classList.add('error');
          return;
        }

        messageEl.textContent = 'A verification link has been sent to your email. Please check and verify before logging in.';
        messageEl.classList.add('info');

        // Clear form
        firstNameInput.value = '';
        lastNameInput.value = '';
        emailInput.value = '';
        passwordInput.value = '';
        companyInput.value = '';
        registrationNumberInput.value = '';
        contactInput.value = '';

      } catch (err) {
        messageEl.textContent = 'Unexpected error: ' + err.message;
        messageEl.classList.add('error');
      }
    });
  </script>
</body>
</html>
