<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraduateInHunt - Message Graduate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1e3a8a;
    --blue: #3b82f6;
    --ink: #0f172a;
    --muted: #64748b;
    --page: #f4f6fb;
    --line: #e5e9f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--page); color: var(--ink);
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ===== Top bar ===== */
  .topbar { background: #fff; }
  .topbar-inner {
    max-width: 1100px; margin: 0 auto; padding: 0 24px; height: 64px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; letter-spacing: -0.02em; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px; color: #fff; font-weight: 700; font-size: 1.05rem;
    background: linear-gradient(145deg, var(--navy), var(--blue)); display: grid; place-items: center;
  }
  .nav { display: flex; align-items: center; gap: 26px; }
  .nav a, .nav button {
    display: inline-flex; align-items: center; gap: 7px; font: inherit; font-weight: 600; font-size: 0.92rem;
    color: var(--muted); background: none; border: 0; padding: 6px 0; cursor: pointer; transition: color .2s;
  }
  .nav a:hover, .nav button:hover, .nav a.active { color: var(--navy); }

  /* ===== Banner ===== */
  .hero {
    background: linear-gradient(100deg, #1e3a8a 0%, #2d5bc4 55%, #3b82f6 100%);
    color: #fff; padding: 36px 24px 90px; border-radius: 0 0 0 28px;
  }
  .hero-inner { max-width: 1100px; margin: 0 auto; }
  .hero h1 { margin: 0 0 14px; font-size: clamp(1.7rem, 4vw, 2.3rem); font-weight: 800; letter-spacing: -0.035em; line-height: 1.15; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: .84rem;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.4); word-break: break-all;
  }
  .chip svg.i { width: 15px; height: 15px; }

  /* ===== Chat ===== */
  .wrap { max-width: 820px; margin: -58px auto 0; padding: 0 24px 56px; }
  .chat {
    background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
    box-shadow: 0 14px 34px rgba(30,58,138,.10); display: flex; flex-direction: column;
  }
  .chat-messages {
    height: min(58vh, 480px); overflow-y: auto; padding: 20px; background: #f8faff;
    display: flex; flex-direction: column; gap: 10px;
  }
  .message { max-width: 76%; padding: 10px 14px; border-radius: 18px; line-height: 1.5; font-size: .95rem; word-break: break-word; }
  .message .text { white-space: pre-wrap; }
  /* Recruiter = you (right, gradient). Student = them (left, white). */
  .message.recruiter { align-self: flex-end; color: #fff; background: linear-gradient(145deg, var(--navy), var(--blue)); border-bottom-right-radius: 6px; }
  .message.student { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .message .time { font-size: .72rem; opacity: .75; margin-top: 4px; }
  .message a.file-link { display: inline-block; margin-top: 6px; font-weight: 600; text-decoration: underline; color: inherit; }
  .chat-empty { margin: auto; color: var(--muted); font-size: .92rem; text-align: center; }

  .composer { border-top: 1px solid var(--line); padding: 14px 16px 16px; background: #fff; display: grid; gap: 10px; }
  .composer textarea {
    width: 100%; min-height: 76px; max-height: 160px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line);
    font: inherit; font-size: .95rem; resize: none; background: #fbfcff; color: var(--ink); transition: border-color .2s, box-shadow .2s;
  }
  .composer textarea:focus { outline: none; border-color: var(--blue); background: #fff; box-shadow: 0 0 0 4px rgba(59,130,246,.18); }
  .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .attach {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; cursor: pointer;
    font-weight: 600; font-size: .88rem; color: var(--navy); background: #eef3ff; border: 1px solid #d3defa; transition: background .15s;
  }
  .attach:hover { background: #e0e9ff; }
  .attach:focus-within { outline: 3px solid var(--blue); outline-offset: 2px; }
  .attach input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  #fileName { font-size: .85rem; color: var(--muted); flex: 1 1 120px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sendReplyBtn {
    margin-left: auto; border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: .92rem; color: #fff;
    padding: 10px 26px; border-radius: 999px; background: linear-gradient(145deg, var(--navy), var(--blue)); transition: box-shadow .15s;
  }
  #sendReplyBtn:hover:not(:disabled) { box-shadow: 0 8px 18px rgba(30,58,138,.3); }
  #sendReplyBtn:disabled { opacity: .65; cursor: progress; }

  #feedback p { margin: 0; font-size: .88rem; font-weight: 600; }
  #feedback p.success { color: #15803d; }
  #feedback p.error { color: #b91c1c; }

  .back {
    display: inline-block; margin-top: 18px; padding: 10px 22px; border-radius: 999px; font-weight: 600; font-size: .92rem;
    background: #fff; border: 1px solid var(--line); transition: box-shadow .15s;
  }
  .back:hover { box-shadow: 0 4px 12px rgba(30,58,138,.12); }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  @media (max-width: 760px) {
    .nav .label { display: none; }
    .nav { gap: 18px; }
    .nav svg.i { width: 22px; height: 22px; }
    .topbar-inner { padding: 0 16px; }
    .hero { padding: 30px 16px 84px; }
    .wrap { padding: 0 14px 48px; }
    .message { max-width: 88%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="recruiter-dashboard.html"><span class="brand-mark">G</span>GraduateInHunt</a>
    <nav class="nav" aria-label="Main">
      <a href="recruiter-dashboard.html">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span class="label">Dashboard</span></a>
      <a href="recruiter-messages.html" class="active">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span class="label">Messages</span></a>
      <a href="homepage.html" id="logoutBtn">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span class="label">Logout</span></a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <h1>Message <span id="gradName">Loading...</span></h1>
    <div class="chips">
      <span class="chip">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        <span id="gradEmail">Loading...</span>
      </span>
      <span class="chip">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
        <span id="gradPhone">Loading...</span>
      </span>
    </div>
  </div>
</section>

<main class="wrap">
  <div class="chat">
    <div class="chat-messages" id="chatMessages" aria-live="polite"></div>

    <div class="composer">
      <textarea id="replyText" placeholder="Type your message..." aria-label="Your message"></textarea>
      <div class="actions">
        <label class="attach">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.5l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg>
          Attach file
          <input type="file" id="fileInput">
        </label>
        <span id="fileName"></span>
        <button id="sendReplyBtn" type="button">Send</button>
      </div>
      <div id="feedback"></div>
    </div>
  </div>

  <a class="back" href="recruiter-messages.html">Back to accepted students</a>
</main>

<script type="module" src="recruiter-message.js"></script>
<script>
  // Show the chosen file name next to the Attach button
  document.getElementById('fileInput').addEventListener('change', function () {
    document.getElementById('fileName').textContent = this.files[0] ? this.files[0].name : '';
  });
</script>
</body>
</html>
