<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recruiter Login - GraduateInHunt</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #f4f6f9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px;
    color: #1f2937;
  }

  .login-container {
    background: white;
    padding: 40px 30px;
    border-radius: 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 400px;
  }

  h2 { text-align: center; color: #1e3a8a; margin-bottom: 30px; font-weight: 600; }

  label { display: block; margin-top: 15px; font-weight: 600; font-size: 0.95rem; }

  .input-wrapper { position: relative; margin-top: 5px; }

  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font: 400 1rem 'Inter', sans-serif;
    transition: border 0.3s, box-shadow 0.3s;
  }
  input.has-toggle { padding-right: 64px; }
  input:focus { border-color: #1e3a8a; box-shadow: 0 0 6px rgba(30,58,138,0.2); outline: none; }

  .toggle-password {
    position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
    margin: 0; padding: 6px 8px; width: auto;
    background: none; border: none; color: #555; font: 500 0.85rem 'Inter', sans-serif; cursor: pointer;
  }
  .toggle-password:hover { background: none; transform: translateY(-50%); color: #1e3a8a; }

  .forgot-password {
    display: block; margin-top: 8px; font-size: 0.9rem; color: #1e3a8a;
    text-decoration: none; font-weight: 500; text-align: right;
  }
  .forgot-password:hover { text-decoration: underline; }

  button {
    margin-top: 25px; width: 100%; padding: 12px; background: #1e3a8a; color: white;
    border: none; border-radius: 10px; cursor: pointer; font: 600 1rem 'Inter', sans-serif;
    transition: background 0.3s, transform 0.2s;
  }
  button:hover:not(:disabled) { background: #16275f; transform: translateY(-2px); }
  button:disabled { opacity: .7; cursor: progress; }

  #goBackBtn { margin-top: 10px; background: #6b7280; }
  #goBackBtn:hover:not(:disabled) { background: #4b5563; }

  .message { text-align: center; margin-top: 15px; font-weight: 500; font-size: 0.95rem; }
  .message.error { color: #b00020; }
  .message.success { color: #1e7e34; }

  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #ffd23f; outline-offset: 2px; }
</style>
</head>
<body>

<main class="login-container">
  <h2>Recruiter Login</h2>

  <form id="loginForm" novalidate>
    <label for="email">Email</label>
    <div class="input-wrapper">
      <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>
    </div>

    <label for="password">Password</label>
    <div class="input-wrapper">
      <input type="password" id="password" class="has-toggle" placeholder="Enter your password" autocomplete="current-password" required>
      <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">Show</button>
    </div>

    <a href="recruiter-forgot-password.html" class="forgot-password">Forgot password?</a>

    <button id="loginBtn" type="submit">Login</button>
    <button id="goBackBtn" type="button">Go back</button>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </form>
</main>

<script type="module" src="recruiter-login.js"></script>
</body>
</html>
