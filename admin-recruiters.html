<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Manage Recruiters</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Inter', sans-serif;
    background: #f4f7fb;
    margin: 0;
    padding: 20px;
  }
  h1 {
    color: #1e3a8a;
    margin-bottom: 20px;
  }
  #message {
    margin-bottom: 15px;
    font-weight: 500;
  }
  #message.success { color: green; }
  #message.error { color: red; }

  input[type="text"] {
    padding: 8px;
    width: 250px;
    margin-bottom: 20px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }
  th, td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    text-align: left;
  }
  th { background: #1e3a8a; color: white; }
  tr.unverified { background: #fff7e6; }

  button {
    padding: 6px 12px;
    margin-right: 5px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .verifyBtn { background: #4caf50; color: white; }
  .verifyBtn.unverify { background: #f44336; }
  .checkCIPC { background: #1e90ff; color: white; }

  #pendingCount {
    margin-bottom: 10px;
    font-weight: 600;
  }
</style>
</head>
<body>

<h1>Admin - Manage Recruiters</h1>

<div id="message" class="message"></div>
<input type="text" id="search" placeholder="Search recruiters...">
<div id="pendingCount"></div>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Company</th>
      <th>Registration Number</th>
      <th>Contact</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="recruiterTableBody">
    <!-- Rows will be rendered here -->
  </tbody>
</table>

<script type="module" src="admin-recruiters.js"></script>

</body>
</html>
