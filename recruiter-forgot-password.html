<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recruiter Forgot Password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { 
    font-family: 'Inter', sans-serif; 
    background: #f4f6f9; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
  }

  .container { 
    background: white; 
    padding: 40px 30px; 
    border-radius: 16px; 
    box-shadow: 0 6px 20px rgba(0,0,0,0.1); 
    width: 100%; 
    max-width: 400px; 
  }

  h2 { 
    text-align: center; 
    color: #1e3a8a; 
    margin-bottom: 30px; 
    font-weight: 600; 
  }

  label { 
    display: block; 
    margin-top: 15px; 
    font-weight: 600; 
    font-size: 0.95rem; 
  }

  input { 
    width: 100%; 
    padding: 12px 14px; 
    border-radius: 10px; 
    border: 1px solid #ccc; 
    font-size: 1rem; 
    margin-top: 5px;
    transition: border 0.3s, box-shadow 0.3s; 
  }

  input:focus { 
    border-color: #1e3a8a; 
    box-shadow: 0 0 6px rgba(30, 58, 138, 0.2); 
    outline: none; 
  }

  button { 
    margin-top: 25px; 
    width: 100%; 
    padding: 12px; 
    background: #1e3a8a; 
    color: white; 
    border: none; 
    border-radius: 10px; 
    cursor: pointer; 
    font-size: 1rem; 
    font-weight: 600; 
    transition: background 0.3s, transform 0.2s; 
  }

  button:hover { 
    background: #16275f; 
    transform: translateY(-2px); 
  }

  #goBackBtn { 
    margin-top: 10px; 
    background: #6b7280; 
  }

  #goBackBtn:hover { 
    background: #4b5563; 
  }

  #message { 
    text-align: center; 
    margin-top: 15px; 
    font-weight: 500;
  }

</style>
</head>
<body>

<div class="container">
  <h2>Recruiter Password Reset</h2>

  <label for="email">Enter your registered email</label>
  <input type="email" id="email" placeholder="Enter your email" required>

  <button id="resetBtn">Send Reset Link</button>
  <button id="goBackBtn" type="button">Go Back</button>
  <p id="message"></p>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  const SUPABASE_URL = 'https://euclknvsppptbfclwxqq.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1Y2xrbnZzcHBwdGJmY2x3eHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2Mjc2NTQsImV4cCI6MjA3MzIwMzY1NH0.HlGW3kZJ4CPnF2JuZGs_4ObkhxwVFTSedb7O8HHDEag';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const emailInput = document.getElementById('email');
  const resetBtn = document.getElementById('resetBtn');
  const goBackBtn = document.getElementById('goBackBtn');
  const message = document.getElementById('message');

  // Go Back button
  goBackBtn.addEventListener('click', () => {
    history.back();
  });

  // Send password reset
  resetBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    if (!email) {
      message.style.color = 'red';
      message.textContent = "Please enter your email";
      return;
    }

    try {
      const { data, error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: 'http://127.0.0.1:5500/recruiter-update-password.html'
      });

      if (error) throw error;

      message.style.color = 'green';
      message.textContent = "✅ Reset link sent! Check your email.";
    } catch(err) {
      console.error(err);
      message.style.color = 'red';
      message.textContent = err.message;
    }
  });
</script>

</body>
</html>
