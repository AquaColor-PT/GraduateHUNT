<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraduateInHunt - All Jobs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1e3a8a;
    --blue: #3b82f6;
    --ink: #0f172a;
    --muted: #64748b;
    --page: #f4f6fb;
    --line: #e5e9f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--page); color: var(--ink);
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ===== Top bar (same on every page) ===== */
  .topbar { background: #fff; }
  .topbar-inner {
    max-width: 1100px; margin: 0 auto; padding: 0 24px; height: 64px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; letter-spacing: -0.02em; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px; color: #fff; font-weight: 700; font-size: 1.05rem;
    background: linear-gradient(145deg, var(--navy), var(--blue)); display: grid; place-items: center;
  }
  .nav { display: flex; align-items: center; gap: 26px; }
  .nav a, .nav button {
    display: inline-flex; align-items: center; gap: 7px; font: inherit; font-weight: 600; font-size: 0.92rem;
    color: var(--muted); background: none; border: 0; padding: 6px 0; cursor: pointer; transition: color .2s;
  }
  .nav a:hover, .nav button:hover, .nav a.active { color: var(--navy); }

  /* ===== Banner with search ===== */
  .hero {
    background: linear-gradient(100deg, #1e3a8a 0%, #2d5bc4 55%, #3b82f6 100%);
    color: #fff; text-align: center; padding: 44px 24px 52px; border-radius: 0 0 0 28px;
  }
  .hero h1 { margin: 0 0 8px; font-size: clamp(1.9rem, 4.5vw, 2.6rem); font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; }
  .hero p { margin: 0 auto 24px; max-width: 560px; font-size: 1rem; line-height: 1.5; color: rgba(255,255,255,.9); }
  .search {
    max-width: 640px; margin: 0 auto; background: #fff; border-radius: 14px; height: 52px; padding: 0 8px 0 16px;
    display: flex; align-items: center; gap: 10px; color: var(--muted); box-shadow: 0 10px 30px rgba(10,25,80,.25);
  }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: .95rem; color: var(--ink); background: transparent; }
  .search button {
    border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: .9rem; color: #fff;
    background: linear-gradient(145deg, var(--navy), var(--blue)); padding: 9px 18px; border-radius: 10px;
  }
  .hero-link { display: inline-block; margin-top: 16px; font-size: .9rem; font-weight: 500; color: rgba(255,255,255,.92); text-decoration: underline; text-underline-offset: 3px; }
  .hero-link:hover { color: #fff; }

  /* ===== Content ===== */
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 24px 56px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    font: inherit; cursor: pointer; padding: 9px 18px; border-radius: 999px; background: #fff; border: 1px solid var(--line);
    font-weight: 600; font-size: .9rem; color: var(--ink); transition: box-shadow .15s;
  }
  .pill:hover { box-shadow: 0 4px 12px rgba(30,58,138,.12); }
  .pill.on { background: linear-gradient(145deg, var(--navy), var(--blue)); color: #fff; border-color: transparent; }
  .count { margin: 18px 0 14px; font-size: .9rem; font-weight: 500; color: var(--muted); }

  #publicJobList { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; align-items: start; }
  #publicJobList > li.note { grid-column: 1 / -1; text-align: center; padding: 48px 20px; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 16px; }
  .job {
    background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 10px;
    transition: box-shadow .2s, transform .2s;
  }
  .job:hover { box-shadow: 0 10px 26px rgba(30,58,138,.10); transform: translateY(-2px); }
  .job-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .job h4 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
  .type { flex: none; font-size: .78rem; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: #eef3ff; color: var(--navy); border: 1px solid #d3defa; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .88rem; color: var(--muted); }
  .meta span { display: inline-flex; align-items: center; gap: 6px; }
  .quals { font-size: .88rem; color: #334155; }
  .desc {
    margin: 0; font-size: .92rem; line-height: 1.55; color: #475569; white-space: pre-line; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .desc.expanded { display: block; }
  .toggleDesc { justify-self: start; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: .88rem; color: var(--navy); }
  .toggleDesc:hover { text-decoration: underline; }
  .job-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
  .job-foot small { color: var(--muted); font-size: .8rem; }
  .applyBtn {
    border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: .9rem; color: #fff; padding: 9px 24px; border-radius: 999px;
    background: linear-gradient(145deg, var(--navy), var(--blue)); transition: box-shadow .15s;
  }
  .applyBtn:hover { box-shadow: 0 6px 16px rgba(30,58,138,.3); }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  @media (max-width: 760px) {
    .nav .label { display: none; }
    .nav { gap: 18px; }
    .nav svg.i { width: 22px; height: 22px; }
    .topbar-inner, .wrap { padding-left: 16px; padding-right: 16px; }
    .hero { padding: 32px 16px 40px; }
    #publicJobList { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="homepageRegisteredUser.html"><span class="brand-mark">G</span>GraduateInHunt</a>
    <nav class="nav" aria-label="Main">
      <a href="homepageRegisteredUser.html">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span class="label">Home</span></a>
      <a href="graduate-profile.html">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg><span class="label">My Profile</span></a>
      <a href="alljobs.html" class="active" aria-current="page">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg><span class="label">All Jobs</span></a>
      <button id="logoutBtn" type="button">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span class="label">Logout</span></button>
    </nav>
  </div>
</header>

<section class="hero">
  <h1>All jobs</h1>
  <p>Every open role on GraduateInHunt, including ones outside your qualification, like retail and general work.</p>
  <div class="search" role="search">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="search" id="jobTitleSearch" placeholder="Search by job title..." aria-label="Search by job title">
    <button type="button" id="searchBtn">Search</button>
  </div>
  <a class="hero-link" href="browse-jobs.html">Prefer jobs that match your qualification? View matched jobs</a>
</section>

<main class="wrap">
  <div class="pills" id="typePills" aria-label="Job types">
    <button class="pill on" type="button" data-type="">All</button>
    <button class="pill" type="button" data-type="internship">Internship</button>
    <button class="pill" type="button" data-type="learnership">Learnership</button>
    <button class="pill" type="button" data-type="training">Training Program</button>
    <button class="pill" type="button" data-type="part">Part-time</button>
    <button class="pill" type="button" data-type="permanent">Permanent</button>
    <button class="pill" type="button" data-type="contract">Contract</button>
  </div>

  <p class="count" id="resultCount" aria-live="polite"></p>

  <ul id="publicJobList">
    <li class="note">Loading jobs...</li>
  </ul>
</main>

<script type="module" src="alljobs.js?v=2"></script>
</body>
</html>
